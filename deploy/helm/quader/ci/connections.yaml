# Two object-store connections (R-HA-072). The first, default, comes from the Secret an S3 provisioner writes (AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, S3_BUCKET, S3_REGION, S3_ENDPOINT as a host without scheme): its credentials, bucket, region and endpoint
# are mounted as files from that Secret, and its element names none of them. The second, secondary, is a bucket at another
# provider with static keys of its own and a private CA. The backup is on, so its pods read each connection with a login of
# its own instead of the runtime keys.
backup:
  enabled: true
config:
  backup:
    target:
      bucket: quader-backups
  server:
    base_url: https://quader.example.com
  database:
    host: quader-db-rw.quader.svc
  storage:
    connections:
      - id: default
        force_path_style: true
        credentials_source: static
      - id: secondary
        bucket: quader-blobs-secondary
        region: eu01
        endpoint: object.storage.eu01.example.net  # a host without scheme: https
        credentials_source: static
  valkey:
    sentinel:
      addresses:
        - quader-valkey-sentinel-0.quader-valkey-sentinel.quader.svc:26379
        - quader-valkey-sentinel-1.quader-valkey-sentinel.quader.svc:26379
        - quader-valkey-sentinel-2.quader-valkey-sentinel.quader.svc:26379
      primary_name: quader
tls:
  certManager:
    issuerRef:
      name: cluster-ca                             # example: the cert-manager ClusterIssuer that issues the pair of every kind of pod
secrets:
  database:
    existingSecret: quader-db-app
  storageConnections:
    - connectionId: default
      existingSecret: quader-s3                    # written by the provisioner
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
      bucketKey: S3_BUCKET
      regionKey: S3_REGION
      endpointKey: S3_ENDPOINT
      backupSource:
        existingSecret: quader-s3-read             # a login that only reads the provisioner's bucket
    - connectionId: secondary
      existingSecret: quader-s3-secondary          # the keys access-key-id and secret-access-key
      ca:
        existingSecret: quader-s3-secondary-ca     # the private CA of the second provider, key ca.crt
      backupSource:
        existingSecret: quader-s3-secondary-read
  valkey:
    existingSecret: quader-valkey
  encryption:
    existingSecret: quader-encryption-keys
    keys: [2026-10.key]
