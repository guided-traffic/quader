# The first step of the upgrade across the cut: web.enabled renders <fullname>-web and the Service
# <fullname> with the edge of the old shape beside api, packages and worker; an endpoint pool is then a pool of web.
web:
  enabled: true
config:
  server:
    base_url: https://quader.example.com
  database:
    host: quader-db-rw.quader.svc
  storage:
    s3:
      bucket: quader-blobs
  valkey:
    sentinel:
      addresses:
        - quader-valkey-sentinel-0.quader-valkey-sentinel.quader.svc:26379
        - quader-valkey-sentinel-1.quader-valkey-sentinel.quader.svc:26379
        - quader-valkey-sentinel-2.quader-valkey-sentinel.quader.svc:26379
      primary_name: quader
tls:
  secretName: quader-tls
secrets:
  database:
    existingSecret: quader-db-app
  valkey:
    existingSecret: quader-valkey
  encryption:
    existingSecret: quader-encryption-keys
    keys: [2026-10.key]
ingress:
  enabled: true
  className: traefik
  backendTLS:
    controller: traefik
    verify: false
endpoints:
  customers:
    port: 8443
    baseUrl: https://packages.example.com
    tls:
      existingSecret: quader-packages-tls
    pool:
      enabled: true
      replicaCount: 3
    ingress:
      enabled: true
      className: traefik-external
      backendTLS:
        controller: traefik
        verify: false
