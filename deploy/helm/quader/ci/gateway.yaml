# The Gateway API edge (R-HA-038): an HTTPRoute on a platform-owned Gateway beside the Ingress, the pools' paths,
# a filter on every rule and the BackendTLSPolicies of the Services the route names.
config:
  server:
    base_url: https://quader.example.com
  database:
    host: quader-db-rw.quader.svc
  storage:
    connections:
      - bucket: quader-blobs
    upload:
      max_size: 10GiB
  valkey:
    sentinel:
      addresses:
        - quader-valkey-sentinel-0.quader-valkey-sentinel.quader.svc:26379
        - quader-valkey-sentinel-1.quader-valkey-sentinel.quader.svc:26379
        - quader-valkey-sentinel-2.quader-valkey-sentinel.quader.svc:26379
      primary_name: quader
tls:
  certManager:
    issuerRef:
      name: cluster-ca                             # example: the one value TLS needs (tls.enabled defaults to true)
  backendTLSPolicy:
    enabled: true
    caConfigMapName: quader-tls-ca
secrets:
  database:
    existingSecret: quader-db-app
  valkey:
    existingSecret: quader-valkey
  encryption:
    existingSecret: quader-encryption-keys
    keys: [2026-10.key]
ingress:
  enabled: true
  backendTLS:
    verify: false
gateway:
  enabled: true
  parentRefs:
    - name: shared
      namespace: gateway-system
      sectionName: https
  timeouts:
    request: 2h
    backendRequest: 90m
  filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
          - name: X-Edge
            value: gateway
api:
  pools:
    - name: exports
      paths: [/api/v1/exports]
