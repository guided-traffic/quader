# The object store comes from the Secret an S3 provisioner writes (AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, S3_BUCKET, S3_REGION, S3_ENDPOINT as a host without scheme): the
# credentials are mounted as files, bucket, region and endpoint are read into environment
# variables from the same Secret, and config.storage.s3 needs none of them. The backup is on, so its pods read the
# blob bucket with a login of their own (secrets.backupSource) instead of the provisioner's.
backup:
  enabled: true
config:
  backup:
    target:
      bucket: quader-backups
  server:
    base_url: https://quader.example.com
  database:
    host: quader-db-rw.quader.svc
  storage:
    s3:
      force_path_style: true
      credentials:
        source: static
  valkey:
    sentinel:
      addresses:
        - quader-valkey-sentinel-0.quader-valkey-sentinel.quader.svc:26379
        - quader-valkey-sentinel-1.quader-valkey-sentinel.quader.svc:26379
        - quader-valkey-sentinel-2.quader-valkey-sentinel.quader.svc:26379
      primary_name: quader
tls:
  secretName: quader-tls
secrets:
  backupSource:
    existingSecret: quader-s3-read             # a login that only reads the blob bucket
  database:
    existingSecret: quader-db-app
  s3:
    existingSecret: quader-s3                      # example: written by the provisioner
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    bucketKey: S3_BUCKET
    regionKey: S3_REGION
    endpointKey: S3_ENDPOINT
  valkey:
    existingSecret: quader-valkey
  encryption:
    existingSecret: quader-encryption-keys
    keys: [2026-10.key]
