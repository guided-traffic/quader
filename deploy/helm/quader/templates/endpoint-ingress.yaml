{{- /*
One Ingress per further endpoint with ingress.enabled (R-EP-008): the class, one rule per host of the
endpoint (the host of its base URL, every exact host, the wildcard host) with the path rules of its
surface (templates/_edge.tpl: path / to the one Service when the surface lies within one role, the
rows of R-HA-037's table whose families it holds to the Service of their role otherwise), each with
pathType Prefix, over TLS as R-HA-063 wires it for the default Ingress, and the endpoint's own tls
entries (one Secret per certificate set, chosen by SNI at the edge). With ingress-nginx and a surface
of both roles, the rules of each role get an Ingress of their own, named as its Service (Q-HA-348).
*/ -}}
{{- range $name := include "quader.endpointNames" . | fromYamlArray }}
{{- $e := include "quader.endpoint" (dict "root" $ "name" $name) | fromYaml }}
{{- if $e.ingressEnabled }}
{{- $svc := printf "%s-ep-%s" (include "quader.fullname" $) $name }}
{{- $bt := include "quader.endpointBackendTLS" (dict "root" $ "name" $name) | fromYaml }}
{{- $hosts := include "quader.endpointHosts" $e | fromYamlArray }}
{{- $rules := include "quader.edgeRules" (dict "root" $ "endpoint" $name) | fromYamlArray }}
{{- range $g := include "quader.ingressGroups" (dict "root" $ "rules" $rules "name" $svc "endpoint" $name "controller" $bt.controller) | fromYamlArray }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $g.name }}
  labels:
    {{- include "quader.labels" (dict "root" $ "component" "ingress") | nindent 4 }}
    quader/endpoint: {{ $name | quote }}
  {{- $ann := merge (dict) $e.ingressAnnotations $.Values.commonAnnotations }}
  {{- $ann = merge (include "quader.backendIngressAnnotations" (dict "root" $ "bt" $bt "kind" $g.kind "own" ($e.tlsSecret | default "") "service" $g.service) | fromYaml) $ann }}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
spec:
  {{- with $e.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $g.tls }}
  {{- with $e.ingressTLS }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  rules:
    {{- $allHosts := $hosts }}
    {{- with $e.wildcardHost }}{{ $allHosts = append $allHosts . }}{{- end }}
    {{- range $allHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range $rule := $g.rules }}
          - path: {{ $rule.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $rule.service }}
                port:
                  number: {{ $e.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
