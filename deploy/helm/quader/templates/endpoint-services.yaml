{{- /*
The Services of a further endpoint (R-EP-008, Q-EP-71): <fullname>-ep-<name> with the endpoint's port,
selecting the pods of the role that serves the surface's packages and files families (the api pods
when the surface holds neither), and <fullname>-api-ep-<name> beside it, selecting the api pods, when
the surface holds families of both roles. With an endpoint pool the selectors name the pool's pods.
sessionAffinity is fixed to None like every Service (R-HA-037).
*/ -}}
{{- range $name := include "quader.endpointNames" . | fromYamlArray }}
{{- $e := include "quader.endpoint" (dict "root" $ "name" $name) | fromYaml }}
{{- $roles := include "quader.surfaceRoles" (dict "root" $ "name" $name) | fromYamlArray }}
{{- $targets := list (dict "prefix" "" "role" (first $roles)) }}
{{- if eq (len $roles) 2 }}
{{- $targets = append $targets (dict "prefix" "api-" "role" "api") }}
{{- end }}
{{- range $t := $targets }}
{{- $role := $t.role }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quader.fullname" $ }}-{{ $t.prefix }}ep-{{ $name }}
  labels:
    {{- include "quader.labels" (dict "root" $ "component" $role "pool" $e.pool) | nindent 4 }}
    quader/endpoint: {{ $name | quote }}
  {{- $bt := include "quader.endpointBackendTLS" (dict "root" $ "name" $name) | fromYaml }}
  {{- $svcAnn := merge (dict) $e.serviceAnnotations $.Values.commonAnnotations }}
  {{- /* HAProxy Ingress and Traefik read the backend's name, CA, scheme and transport from the Service (R-HA-063, Q-HA-348): the kind's,
  or the Service's own name with the endpoint's own pair. */}}
  {{- if and $e.ingressEnabled (not $e.tlsPassthrough) }}
  {{- $svcAnn = merge (include "quader.backendServiceAnnotations" (dict "root" $ "bt" $bt "kind" $role "own" ($e.tlsSecret | default "") "service" (printf "%s-%sep-%s" (include "quader.fullname" $) $t.prefix $name)) | fromYaml) $svcAnn }}
  {{- end }}
  {{- if $svcAnn }}
  annotations:
    {{- toYaml $svcAnn | nindent 4 }}
  {{- end }}
spec:
  type: {{ $e.serviceType }}
  sessionAffinity: None
  {{- with $e.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: ep-{{ $name }}
      port: {{ $e.port }}
      targetPort: {{ $e.port }}
      protocol: TCP
      {{- if $.Values.tls.enabled }}
      appProtocol: https
      {{- end }}
  selector:
    {{- include "quader.selectorLabels" (dict "root" $ "component" $role "pool" $e.pool) | nindent 4 }}
{{- end }}
{{- end }}
