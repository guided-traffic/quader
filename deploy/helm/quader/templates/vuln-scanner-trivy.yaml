{{- /*
The image scanning's scanner, the kind vuln-scanner-trivy of the role scanner (R-HA-065, R-HA-066, R-HA-070, ADR-212, ADR-229, Q-HA-372):
<fullname>-vuln-scanner-trivy runs "quader serve --role scanner" and analyses container images and detects their stored analyses with
Trivy for the worker. Its second container, database, runs the same image as the loader of Trivy's database (the kind trivy-db,
R-VULN-049, Q-HA-379): it reads the database in use from the scan listener with the pod's pair into the volume trivy-db, which the
container quader mounts read-only, so no analysis and no detection can change what judges the next image (Q-VULN-196). The analyser
itself comes from its own image (trivy.image, the pin TRIVY_IMAGE): the init container trivy copies its binary into the volume trivy-bin,
which quader mounts read-only at /opt/trivy, where vulnerabilities.images.binary points (R-HA-070, Q-HA-378); the release image holds
none. The pod holds no secret of PostgreSQL, the object store or Valkey and no key of the key ring: its volumes are the spool, a /tmp per
container, the configuration file, its own Secret (R-HA-063: the pair it serves and presents, and the internal CA in the same volume),
trivy-db and trivy-bin, and nothing else; none of the shared extras (extraEnv, extraEnvFrom, extraVolumes, extraVolumeMounts) reaches it (Q-HA-321). It uses no
service account of the chart: that one may carry a cloud identity of the object store, and the scanner calls no API
(automountServiceAccountToken false, no RBAC).

Beside the Deployment: its PodDisruptionBudget and autoscaler, the two ClusterIP Services of the links (<fullname>-vuln-scanner-trivy on
8080, <fullname>-packages-scan on 8082 of the main packages pods, Q-HA-319, rendered while either scanning is on), and its NetworkPolicy
of ingress rules only (ADR-154): the scanner admits 8080 from the worker Deployment that claims the queue vuln (Q-HA-320) and 8081 from
the ops peers; the loader's operations port 8083 gets no rule, only the kubelet's probe reaches it. The rule of the main packages pods
that admits 8082 from the scanner's pods, the loader's reads included, is one rule more of their own policy (templates/networkpolicy.yaml,
quader.scanListenRule). Nothing is rendered while the image scanning is off.
*/ -}}
{{- if include "quader.imageScanOn" . }}
{{- $ := . }}
{{- $r := .Values.vulnScannerTrivy }}
{{- $fullname := include "quader.fullname" . }}
{{- $ctx := dict "root" $ "role" "vuln-scanner-trivy" "r" $r "pool" "" }}
{{- $tlsSecret := include "quader.tlsSecret" (dict "root" . "kind" "vuln-scanner-trivy") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-vuln-scanner-trivy
  labels:
    {{- include "quader.labels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 4 }}
  {{- with (include "quader.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $r.autoscaling.enabled }}
  replicas: {{ $r.replicaCount }}
  {{- else }}
  {{- $live := lookup "apps/v1" "Deployment" $.Release.Namespace (printf "%s-vuln-scanner-trivy" $fullname) }}
  {{- if $live }}
  replicas: {{ int (dig "spec" "replicas" 1 $live) }}
  {{- end }}
  {{- end }}
  minReadySeconds: {{ $r.minReadySeconds }}
  revisionHistoryLimit: {{ $r.revisionHistoryLimit }}
  strategy:
    {{- toYaml $r.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "quader.selectorLabels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "quader.config" $ | sha256sum }}
        {{- with $r.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quader.labels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 8 }}
        quader/serve: "true"
        {{- with $r.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $r.terminationGracePeriodSeconds }}
      {{- include "quader.imagePullSecrets" $ | nindent 6 }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $r.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $r.schedulerName }}
      schedulerName: {{ . }}
      {{- end }}
      {{- with $r.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ $r.nodeFailureTolerationSeconds }}
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ $r.nodeFailureTolerationSeconds }}
        {{- with $r.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "quader.topologySpread" $ctx | nindent 6 }}
      {{- /* The analyser from its own image (R-HA-070, Q-HA-378): the image's own cp copies its binary into trivy-bin as the pod's user and
      ends; the release image holds no analyser. One volume, no Secret, no configuration, no token. */}}
      initContainers:
        - name: trivy
          image: {{ $.Values.trivy.image | quote }}
          imagePullPolicy: {{ $.Values.trivy.pullPolicy }}
          command:
            - cp
            - /usr/local/bin/trivy
            - /opt/trivy/trivy
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.trivy.resources | nindent 12 }}
          volumeMounts:
            - name: trivy-bin
              mountPath: /opt/trivy
      containers:
        {{- /* The scanner is the first process of its container: no shell, no init, which the reaper of Q-ARCH-530 relies on. */}}
        - name: quader
          image: {{ include "quader.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - serve
            - --role
            - scanner
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: https
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 8081
              protocol: TCP
          env:
            {{- include "quader.podEnv" $ | nindent 12 }}
            - name: QUADER_RUNTIME_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
            - name: QUADER_RUNTIME_TERMINATION_GRACE_PERIOD
              value: {{ printf "%ds" (int64 $r.terminationGracePeriodSeconds) | quote }}
            - name: QUADER_STORAGE_SPOOL_MAX_BYTES
              value: {{ sub (include "quader.bytes" (include "quader.spoolSize" $ctx) | int64) (include "quader.bytes" $.Values.spool.headroom | int64) | quote }}
            {{- if not (dig "limits" "cpu" "" $r.resources) }}
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: requests.cpu
                  divisor: "1"
            {{- end }}
            - name: TMPDIR
              value: /tmp
            {{- with $r.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "quader.probes" $ | nindent 10 }}
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/quader/quader.yaml
              subPath: quader.yaml
              readOnly: true
            - name: spool
              mountPath: /var/lib/quader/spool
            - name: tmp
              mountPath: /tmp
            {{- /* The database, read-only: the analysers this container starts can read it and change nothing of it (Q-VULN-196). */}}
            - name: trivy-db
              mountPath: /var/lib/quader/trivy-db
              readOnly: true
            {{- /* The analyser the init container copied, read-only: the copy belongs to the pod's user, the user of every analyser, so only
            this mount keeps one analysis from replacing the binary of the next (Q-HA-378); vulnerabilities.images.binary points here. */}}
            - name: trivy-bin
              mountPath: /opt/trivy
              readOnly: true
            {{- if $.Values.tls.enabled }}
            - name: secret-tls
              mountPath: /var/run/secrets/quader/tls
              readOnly: true
            {{- end }}
        {{- /* The loader of the database, the kind trivy-db (R-VULN-049, Q-ARCH-564, Q-HA-379): no listener but its operations listener on
        :8083 (the scanner holds :8081 of the pod's network), a liveness probe and no readiness probe; the pod's readiness stays the scanner's. */}}
        - name: database
          image: {{ include "quader.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - serve
            - --role
            - scanner
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: db-ops
              containerPort: 8083
              protocol: TCP
          env:
            {{- include "quader.podEnv" $ | nindent 12 }}
            - name: QUADER_PROCESS_SCANNER_KIND
              value: trivy-db
            - name: QUADER_SERVER_OPS_LISTEN
              value: ":8083"
            - name: QUADER_VULNERABILITIES_IMAGES_DATABASE_DIR_BUDGET
              value: {{ include "quader.bytes" $r.database.sizeLimit | quote }}
            - name: QUADER_RUNTIME_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: database
                  resource: limits.memory
                  divisor: "1"
            - name: QUADER_RUNTIME_TERMINATION_GRACE_PERIOD
              value: {{ printf "%ds" (int64 $r.terminationGracePeriodSeconds) | quote }}
            {{- if not (dig "limits" "cpu" "" $r.database.resources) }}
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: database
                  resource: requests.cpu
                  divisor: "1"
            {{- end }}
            - name: TMPDIR
              value: /tmp
          {{- with $.Values.probes.liveness }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: db-ops
              {{- if $.Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml $r.database.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/quader/quader.yaml
              subPath: quader.yaml
              readOnly: true
            - name: trivy-db
              mountPath: /var/lib/quader/trivy-db
            - name: database-tmp
              mountPath: /tmp
            {{- if $.Values.tls.enabled }}
            - name: secret-tls
              mountPath: /var/run/secrets/quader/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-config
        - name: spool
          {{- /* The spool follows spool.type like every role's (R-HA-061): an emptyDir, or a generic ephemeral volume of one claim per pod. */}}
          {{- if eq $.Values.spool.type "ephemeral" }}
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "quader.labels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 18 }}
              spec:
                accessModes:
                  {{- toYaml $.Values.spool.ephemeral.accessModes | nindent 18 }}
                {{- with $.Values.spool.ephemeral.storageClassName }}
                storageClassName: {{ . }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ $.Values.spool.ephemeral.size }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ include "quader.spoolSize" $ctx }}
            {{- with $.Values.spool.medium }}
            medium: {{ . }}
            {{- end }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ $.Values.tmp.sizeLimit }}
        - name: database-tmp
          emptyDir:
            sizeLimit: {{ $.Values.tmp.sizeLimit }}
        {{- /* The analyser's binary (163,184,800 bytes at the pin), written once by the init container and read-only in quader (R-HA-070). */}}
        - name: trivy-bin
          emptyDir:
            sizeLimit: 256Mi
        {{- /* The database, written by the container database and read-only in quader (R-HA-070, Q-HA-380): it follows spool.type as the spool does,
        vulnScannerTrivy.database.sizeLimit, room for the newest database and the one before it. */}}
        - name: trivy-db
          {{- if eq $.Values.spool.type "ephemeral" }}
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "quader.labels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 18 }}
              spec:
                accessModes:
                  {{- toYaml $.Values.spool.ephemeral.accessModes | nindent 18 }}
                {{- with $.Values.spool.ephemeral.storageClassName }}
                storageClassName: {{ . }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ $r.database.sizeLimit }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $r.database.sizeLimit }}
          {{- end }}
        {{- if $.Values.tls.enabled }}
        {{- /* The scanner's own Secret only (R-HA-063): its pair and, in the same volume so the kubelet swaps them together, the CA it verifies packages against. The loader reads the scan listener with the same pair. */}}
        - name: secret-tls
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        {{- end }}
{{- if $r.podDisruptionBudget.enabled }}
{{- include "quader.pdb" (dict "root" $ "unit" (dict "name" "vuln-scanner-trivy" "role" "vuln-scanner-trivy" "pool" "" "r" $r)) | nindent 0 }}
{{- end }}
{{- with $r.autoscaling }}
{{- if .enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-vuln-scanner-trivy
  labels:
    {{- include "quader.labels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-vuln-scanner-trivy
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    {{- if .targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- with .metrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- /* The two links get ClusterIP Services of their own, never the client Services (Q-HA-319): no value exposes them. */}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-vuln-scanner-trivy
  labels:
    {{- include "quader.labels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 4 }}
  {{- with (include "quader.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: https
      port: 8080
      targetPort: https
      protocol: TCP
      {{- if $.Values.tls.enabled }}
      appProtocol: https
      {{- end }}
  selector:
    {{- include "quader.selectorLabels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 4 }}
{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $ops := list }}
{{- range $np.ingress.ops.from }}{{ $ops = append $ops . }}{{- end }}
{{- range $np.ingress.probeCIDRs }}{{ $ops = append $ops (dict "ipBlock" (dict "cidr" .)) }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-vuln-scanner-trivy
  labels:
    {{- include "quader.labels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quader.selectorLabels" (dict "root" $ "component" "vuln-scanner-trivy") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      from:
        - podSelector:
            matchLabels:
              {{- include "quader.selectorLabels" (dict "root" $ "component" "worker" "pool" (include "quader.vulnWorkerPool" $)) | nindent 14 }}
    {{- if $ops }}
    - ports:
        - protocol: TCP
          port: 8081
      from:
        {{- toYaml $ops | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
{{- /* The scan listener of the main packages pods (R-HA-066, R-HA-068): its Service while either scanning reads through it. */}}
{{- if include "quader.scanListenOn" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quader.fullname" . }}-packages-scan
  labels:
    {{- include "quader.labels" (dict "root" . "component" "packages" "pool" "") | nindent 4 }}
  {{- with (include "quader.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: scan
      port: 8082
      targetPort: scan
      protocol: TCP
      {{- if .Values.tls.enabled }}
      appProtocol: https
      {{- end }}
  selector:
    {{- include "quader.selectorLabels" (dict "root" . "component" "packages" "pool" "") | nindent 4 }}
{{- end }}
