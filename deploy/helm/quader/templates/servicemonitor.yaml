{{- if .Values.metrics.serviceMonitor.enabled }}
{{- /*
Scrapes the ops port of <fullname>-ops, every pod (api, packages and worker), path
/metrics (R-OPS-006, R-HA-045). The endpoint always renders two relabelings that set the target labels
role (from the pod's component label) and pool (from the pod's quader/pool label, which is empty on the
main Deployments and which Prometheus drops when empty); metrics.serviceMonitor.relabelings come after them.
With config.metrics.auth static the bearer token is read from secrets.metricsToken. With tls.enabled the
endpoint verifies the pods against ca.crt of the Secret of the kind api (all kinds' pairs chain to one CA),
which the Prometheus operator reads from the namespace of the ServiceMonitor, and the name
<fullname>-ops.<namespace>.svc, which every kind's pair carries (R-HA-063, Q-HA-349).
*/ -}}
{{- $sm := .Values.metrics.serviceMonitor }}
{{- $fullname := include "quader.fullname" . }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  {{- with $sm.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "quader.labels" (dict "root" . "component" "metrics") | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "quader.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "quader.selectorLabels" (dict "root" . "component" "ops") | nindent 6 }}
  endpoints:
    - port: ops
      path: /metrics
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      {{- if .Values.tls.enabled }}
      scheme: https
      tlsConfig:
        serverName: {{ include "quader.tlsOpsName" . }}
        ca:
          secret:
            name: {{ include "quader.tlsSecret" (dict "root" . "kind" "api") }}
            key: ca.crt
      {{- end }}
      {{- if eq (dig "metrics" "auth" "none" .Values.config) "static" }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.secrets.metricsToken.existingSecret }}
          key: {{ .Values.secrets.metricsToken.key }}
      {{- end }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: role
        - sourceLabels: [__meta_kubernetes_pod_label_quader_pool]
          targetLabel: pool
        {{- with $sm.relabelings }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
