{{- if and .Values.tls.enabled .Values.tls.certManager.issuerRef.name }}
{{- /*
A cert-manager Certificate per kind of pod (R-HA-063, Q-HA-345 to Q-HA-347): <fullname>-tls-<kind> into the Secret of the same name,
for the kind's name and the operations name (plus tls.certManager.extraDnsNames and extraIpAddresses), with the usage server auth and,
for the kinds that present themselves on a link (worker, vuln-scanner-trivy, malware-scanner-clamav), client auth. Ordinary objects of the release, so cert-manager
renews them; rotationPolicy Always makes a renewal change the key too. Each Secret carries ca.crt, which the pods of the links and
the edge verify against.
*/ -}}
{{- $t := .Values.tls }}
{{- $c := $t.certManager }}
{{- range $e := include "quader.tlsKindTable" . | fromYamlArray }}
{{- if $e.on }}
{{- $kind := $e.kind }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "quader.tlsSecret" (dict "root" $ "kind" $kind) }}
  labels:
    {{- include "quader.labels" (dict "root" $ "component" $kind) | nindent 4 }}
  {{- with (include "quader.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "quader.tlsSecret" (dict "root" $ "kind" $kind) }}
  secretTemplate:
    labels:
      app.kubernetes.io/name: {{ include "quader.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $kind }}
  duration: {{ $c.duration }}
  renewBefore: {{ $c.renewBefore }}
  privateKey:
    algorithm: {{ $c.privateKey.algorithm }}
    size: {{ $c.privateKey.size }}
    rotationPolicy: Always
  usages:
    - digital signature
    {{- if eq $c.privateKey.algorithm "RSA" }}
    - key encipherment
    {{- end }}
    - server auth
    {{- if $e.client }}
    - client auth
    {{- end }}
  dnsNames:
    - {{ include "quader.tlsName" (dict "root" $ "kind" $kind) }}
    - {{ include "quader.tlsOpsName" $ }}
    {{- range $c.extraDnsNames }}
    - {{ . | quote }}
    {{- end }}
  {{- with $c.extraIpAddresses }}
  ipAddresses:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  issuerRef:
    name: {{ $t.certManager.issuerRef.name }}
    kind: {{ $t.certManager.issuerRef.kind }}
    group: {{ $t.certManager.issuerRef.group }}
{{- end }}
{{- end }}
{{- end }}
