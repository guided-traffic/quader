apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quader.fullname" . }}-config
  labels:
    {{- include "quader.labels" (dict "root" . "component" "config") | nindent 4 }}
  {{- with (include "quader.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  quader.yaml: |
    {{- include "quader.config" . | nindent 4 }}
