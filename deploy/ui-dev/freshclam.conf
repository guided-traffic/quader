# freshclam.conf of the UI development profile's signature cache (deploy/ui-dev/malware.sh, Q-ARCH-1065): the chart's
# (quader.freshclamConf of deploy/helm/quader/templates/_malware.tpl) with the default values, line for line: ClamAV's network, whole signed
# containers (no patches, so no .cld, which the updater refuses), no load test. The profile runs freshclam once per day and machine, not
# as a daemon, so Checks has no effect here. TestR_HA_069_TheUIProfileRunsTheChartsFreshclamConf (test/chart/malware_test.go) holds the
# two equal.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
Checks 12
ScriptedUpdates no
TestDatabases no
Foreground yes
LogTime yes
