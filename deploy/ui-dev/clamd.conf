# clamd.conf of malware-scanner-clamav in the UI development profile (deploy/ui-dev/malware.sh, Q-ARCH-1065): the chart's
# (quader.clamdConf of deploy/helm/quader/templates/_malware.tpl) with the default values, line for line, so that the profile scans with
# the product's limits and options and reaches clamd by the socket of its two containers alone. TestR_HA_068_TheUIProfileRunsTheChartsClamdConf
# (test/chart/malware_test.go) holds the two equal: change the chart, and this file follows.
LocalSocket /run/clamd/clamd.sock
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /var/tmp/clamd
MaxThreads 2
MaxFileSize 1073741824
StreamMaxLength 1073741824
MaxScanSize 2147483648
MaxScanTime 300000
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
DetectPUA no
ConcurrentDatabaseReload no
SelfCheck 0
Foreground yes
LogTime yes
