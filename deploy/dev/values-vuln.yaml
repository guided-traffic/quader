# The `vuln` e2e profile (R-VULN-029, docs/developer/e2e.md#the-vulnerability-tests), layered after values-dev.yaml and
# values-scatter.yaml (three api and three packages replicas, every request to another one; the worker and the vuln pool with two replicas each from values-dev.yaml) by
# up.sh when QUADER_PROFILE=vuln: the scanning reads the test advisory source (deploy/dev/osvstub.yaml, started by
# e2e.sh with QUADER_E2E_OSVSTUB=1) instead of osv.dev and CISA, and the hosts of the two test upstreams count as public
# registries (R-VULN-010), so a remote repository over them is matched with matchPublicAdvisories auto.
#
# The stub's certificate is signed by the dev CA, which quader trusts for upstreams through proxy.outbound.tls.ca_files
# (values-dev.yaml). The namespace is the one of the dev cluster, as everywhere in values-dev.yaml.
config:
  vulnerabilities:
    sources:
      osv:
        mode: online            # values-dev.yaml switches the sources off
        base_url: https://osvstub.quader.svc/
      kev:
        mode: online
        url: https://osvstub.quader.svc/sites/default/files/feeds/known_exploited_vulnerabilities.json
    # An image pushed by a test is scanned at the next job, not 30 s later: the delay waits for the layers of a remote image's pull,
    # and the case of the scanner (vuln_scanner_test.go) pushes to a local repository and asks within a minute (R-HA-066).
    images:
      scan_delay: 0s
    matching:
      public_upstreams:
        npm: [registry.npmjs.org, npmstub.quader.svc]
        nuget: [api.nuget.org, www.nuget.org, nugetstub.quader.svc]
  # The malware scanning, on in this profile only (values-dev.yaml): as an installation without internet (R-MAL-012), with the source
  # repository, so the chart renders no updater and no test cluster talks to ClamAV's network; its database the files of a few
  # signatures that the end-to-end case deploys to e2e/clamav-db (vuln_malware_test.go). Until they are there the malware scanners are
  # not ready, and up.sh waits for every other Deployment (Q-MAL-90).
  malware:
    enabled: true
    database:
      source: repository
      repository: e2e/clamav-db
  # The three scheduled syncs are off: the tests start every sync through the task API, and a scheduled one that fires inside a
  # test's window is a request to the test advisory source that no test caused (the KEV sync fires at minute 41 of hours 0, 6, 12
  # and 18 UTC, the OSV sync every 15 minutes). A disabled task still runs when it is triggered.
  maintenance:
    tasks:
      vuln-sync-osv: {enabled: false, schedule: "*/15 * * * *"}
      vuln-sync-osv-full: {enabled: false, schedule: "17 3 * * 0"}
      vuln-sync-kev: {enabled: false, schedule: "41 */6 * * *"}
worker:
  pools:
    # A worker of the pool is released 14 s after SIGTERM with this grace period (grace - 5 s of margin - 11 s, internal/app/shutdown.go),
    # not the 44 s of values-dev.yaml: since Q-VULN-90 and Q-VULN-91 the full sync of the 100,000 filler records takes under a minute, and
    # the drain test of R-VULN-004 needs a run that is still working when the release is due (Q-VULN-92).
    - name: vuln
      queues: [vuln]
      replicaCount: 2
      terminationGracePeriodSeconds: 30
# ClamAV of the pin CLAMAV_IMAGE, tagged quader-e2e-clamav:dev and loaded into the nodes by up.sh (the nodes pull nothing from Docker
# Hub for it). clamd holds a database of a few signatures here: its request is the measured one of that database (Q-HA-361); the limit
# stays the chart's floor.
clamav:
  image: quader-e2e-clamav:dev
  pullPolicy: IfNotPresent
malwareScannerClamav:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  clamd:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1536Mi
