# Valkey for the local profile (R-HA-051, R-HA-056): the Valkey operator's `Valkey` resource quader-valkey,
# two data pods and three Sentinels, TLS only, no persistence (emptyDir), PodDisruptionBudgets, one pod of
# each tier per zone. The operator owns the StatefulSets, Services, ConfigMaps and the certificate.
#
# Names a client uses (namespace quader):
#   Sentinels   quader-valkey-sentinel-{0,1,2}.quader-valkey-sentinel-headless.quader.svc.cluster.local:36379
#   primary     quader-valkey (the resource name, `sentinel monitor`)
#   data pods   quader-valkey-{0,1}.quader-valkey-headless.quader.svc.cluster.local:16379 (what Sentinel returns)
#   CA          Secret quader-valkey-tls, key ca.crt (one certificate for both tiers)
#   password    Secret quader-valkey-auth, key password, user `default`
#
# DEVIATIONS from R-HA-056 / R-ARCH-031 (dev profile only; the integration stack keeps the ACL user):
# the operator has no ACL users, no separate Sentinel password and no maxmemory. quader connects as the
# `default` user with the cluster password, and the same password authenticates against the Sentinels.
# Interim, until the operator offers them or the owner decides otherwise.
#
# The image is substituted by lib.sh (render) from DEV_VALKEY_IMAGE.
apiVersion: vko.gtrfc.com/v1
kind: Valkey
metadata:
  name: quader-valkey
spec:
  replicas: 2
  image: ${DEV_VALKEY_IMAGE}
  sentinel:
    enabled: true
    replicas: 3
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {memory: 128Mi}
  auth:
    secretName: quader-valkey-auth
    secretPasswordKey: password
  tls:
    enabled: true
    unifiedCertificate: true
    certManager:
      issuer:
        kind: Issuer
        name: quader-dev-ca
  persistence:
    enabled: false
  podDisruptionBudget:
    enabled: true
  antiAffinity:
    mode: hard
    topologyKey: topology.kubernetes.io/zone
  networkPolicy:
    enabled: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 320Mi}
---
# The operator's NetworkPolicy admits only its own components (ingress only). quader's pods are admitted
# here, to the data pods and the Sentinels alike, on the TLS ports only: the chart's api, packages and worker pods, the
# e2e driver pod and the extra replicas of the Valkey start cases (e12_valkey_test.go), which carry the same labels with
# a component of their own; not the scanners (vuln-scanner-trivy, malware-scanner-clamav), which serve too but are no clients of
# Valkey. Deleting this policy cuts quader off from Valkey (valkey-outage.sh does exactly that).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quader-valkey-clients
  labels:
    app.kubernetes.io/part-of: quader-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: quader-valkey
      app.kubernetes.io/managed-by: vko.gtrfc.com
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quader
              quader/serve: "true"
            # Valkey's clients by name: the scanners carry the serve label too (the ops Service selects them) and hold no Valkey
            # credential; they are not admitted (R-HA-065, Q-HA-344). The E0.12 case with every Sentinel unreachable starts a replica
            # with the component label vuln-scanner-trivy and shows that this policy drops it.
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [api, packages, worker, e2e-driver, e2e-replica]}
      ports:
        - {port: 16379, protocol: TCP}
        - {port: 36379, protocol: TCP}
