# PostgreSQL for the local profile (R-HA-051, R-HA-013): the CloudNativePG cluster quader-db with
# a primary and one standby, synchronous replication with dataDurability preferred (a stopped
# standby does not pause writes on a laptop), the keepalive settings of R-HA-013 and the
# database quader owned by the role quader (single-role mode, R-HA-014).
#
# CloudNativePG creates the Secrets quader-db-app (username, password) and quader-db-ca (ca.crt),
# and the Services quader-db-rw, quader-db-ro and quader-db-r. The chart reads the first two
# directly (secrets.database, secrets.databaseCA), so the profile runs verify-full like
# production. The image is substituted by lib.sh (render) from DEV_CNPG_POSTGRES_IMAGE.
#
# WAL archiving to the bucket quader-pg-archive is off here: QUADER_PITR=1 (up.sh) adds the Barman Cloud plugin
# entry of spec.plugins to this Cluster and applies pitr.yaml, which point-in-time recovery (R-HA-023,
# R-HA-025) needs.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: quader-db
spec:
  instances: 2
  imageName: ${DEV_CNPG_POSTGRES_IMAGE}
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      max_connections: "400"      # the chart's budget (R-HA-016): 303 for api 2, packages 3, worker 2 and the vuln pool 2 with a surge of 1 each, 323 in the scatter profile (api 3), which the upgrade tests run (Q-HA-87)
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"
      client_connection_check_interval: "10s"
      log_parameter_max_length: "0"       # no bound value in the statement log (it becomes a CI artifact, and a value can be a token's hash)
      track_wal_io_timing: "on"           # the WAL write and fsync times in pg_stat_io, which the clients-first sampler of the e2e set mirror reads
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  certificates:
    # The server certificate the operator issues names the Services of the cluster only. The request and the control pooler
    # of the pooler profile (pooler.yaml, QUADER_POOLER=1) present the same certificate, and quader verifies it with verify-full
    # against the pooler's Service (R-HA-015, R-HA-058), so the Services of both poolers are named too.
    serverAltDNSNames:
      - quader-db-pooler-rw
      - quader-db-pooler-rw.${NS}
      - quader-db-pooler-rw.${NS}.svc
      - quader-db-pooler-rw.${NS}.svc.cluster.local
      - quader-db-pooler-control
      - quader-db-pooler-control.${NS}
      - quader-db-pooler-control.${NS}.svc
      - quader-db-pooler-control.${NS}.svc.cluster.local
  bootstrap:
    initdb:
      database: quader
      owner: quader
      postInitApplicationSQL:
        # the slow-statement log, for the role quader alone: a statement or COMMIT of quader above 50 ms shows in the primary's log, which the e2e cluster state keeps.
        # Per-statement logging rules out one slow statement only: the time is then between statements (idle in transaction) or spread over several (active). Set on the
        # role, not the database: the role survives the DROP DATABASE of the upgrade set, and the operator's own statements (ALTER ROLE ... PASSWORD) run as postgres, so they
        # never reach that log. Bootstrap runs once: an existing cluster keeps its settings (docs/developer/local-profile.md says how to set it there).
        - ALTER ROLE quader SET log_min_duration_statement = '50ms'
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
