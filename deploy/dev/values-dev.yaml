# Chart values of the local development profile (R-HA-051): the real chart with every role, api (2 replicas), packages
# (3) and worker (2) plus a worker pool for the queue vuln (2), against the dependencies deploy/dev/up.sh installs into the "quader"
# namespace of the kind cluster "quader". The backup CronJob runs every six hours against the bucket quader-backups of the same
# SeaweedFS (s3.yaml creates it), a bucket of its own beside the blob bucket quader-blobs (R-HA-060).
image:
  registry: docker.io
  repository: guidedtraffic/quader
  tag: dev                       # built by `make image`, loaded by up.sh with `kind load docker-image`
  pullPolicy: IfNotPresent       # the image never leaves the kind nodes

highAvailability:
  enforce: true

# TLS on quader's listeners (R-ARCH-035, R-HA-063): the chart issues a pair per kind of pod (Secrets quader-tls-api,
# -packages, -worker, -vuln-scanner-trivy, and -malware-scanner-clamav in the `vuln` profile) from the dev CA's Issuer (pki.yaml). The extra names let the tests that reach one pod
# through a port-forward verify it as localhost; no check of the chart relies on them. The short reload interval makes
# the rotation drill (E0.15) fast; the chart default is 10s.
tls:
  enabled: true
  certManager:
    issuerRef:
      name: quader-dev-ca
      kind: Issuer
    extraDnsNames: [localhost]
    extraIpAddresses: [127.0.0.1]
  reloadInterval: 2s

api:
  replicaCount: 2
  spool:
    sizeLimit: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 256Mi
    limits:
      memory: 1Gi

packages:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 256Mi
    limits:
      memory: 1Gi

worker:
  replicaCount: 2
  terminationGracePeriodSeconds: 60      # the drain test (E0.14) waits for the grace period of a worker whose job outlasts it; the chart default is 300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
    limits:
      memory: 512Mi
  spool:
    sizeLimit: 8Gi                       # the budget (minus the 2GiB headroom) holds the unpacked database and the largest image of the scanning
  pools:
    - name: vuln
      queues: [vuln]
      replicaCount: 2

spool:
  sizeLimit: 4Gi
  headroom: 2GiB

config:
  server:
    base_url: https://localhost:8080          # the edge's certificate names localhost; up.sh follows QUADER_DEV_HTTP_PORT
    trusted_proxies: ["10.244.0.0/24"]    # the pod range of the control-plane node, where HAProxy Ingress is pinned (haproxy-values.yaml); up.sh checks it against the node's podCIDR
    replica_header: always                 # X-Quader-Replica on every response: the scatter profile (E0.11) counts replicas per request, also anonymous ones
  log:
    level: debug
  api:
    rate_limits:
      # The load scripts and probes of the e2e suite (k6, E0.4 to E0.16) poll /api/v1/system/ping and
      # /system/replicas anonymously from one address, far above the default anonymous class of
      # R-API-016 (5/s, burst 20). The limiter stays on with a budget the load never reaches; the
      # default itself is covered by test/integration/api.
      anonymous:
        requests_per_second: 1000
        burst: 10000
  # No test cluster reaches the public advisory hosts: the scanning's sources are off in every profile but `vuln` (values-vuln.yaml, which
  # points them at the test advisory source). With the OSV source off the audit default of an npm repository is the one of R-NPM-038
  # again (`forward` on remote and virtual repositories, R-VULN-017), which the npm matrix expects.
  vulnerabilities:
    sources:
      osv:
        mode: "off"
      kev:
        mode: "off"
  # Nor does a test cluster fetch the image scanning's database on a schedule: about 142 MB from mirror.gcr.io through
  # upstream/scanner-trivy at minute 23 of every sixth hour (R-VULN-044), which a leg that runs across that minute would pull. No test
  # needs it (the scanner's case asserts the analysis, Q-VULN-168); a disabled task still runs when it is triggered.
  maintenance:
    tasks:
      vuln-sync-trivy-db: {enabled: false, schedule: "23 */6 * * *"}
  # The malware scanning is off in every profile but `vuln` (values-vuln.yaml): no other leg pulls the ClamAV image or runs clamd,
  # and no test cluster runs freshclam, which would fetch ClamAV's real database from ClamAV's network (R-MAL-030, Q-MAL-90).
  malware:
    enabled: false
  system:
    bootstrap_anonymous_read: true         # until authentication ships nobody holds system.read; the E0.13 load reads /system/replicas
  # Login against the test IdP (E1.1, deploy/dev/keycloak.yaml) and the break-glass account (R-AUTH-014). The client
  # secret and the break-glass password come from secrets.oidc and secrets.breakGlass below, which render the file paths.
  # The issuer is the Service name; its certificate is of the dev CA, which the outbound client trusts through proxy.outbound.
  auth:
    oidc:
      providers:
        keycloak:                                 # the ID in the redirect URI /auth/oidc/keycloak/callback of the realm's client
          display_name: Keycloak (dev)
          issuer: https://quader-keycloak.quader.svc:8443/realms/quader
          client_id: quader
          group_sync:
            rules:
              - match_regex: "quader-(.+)"       # quader-team-web -> team-web, quader-platform-admins -> platform-admins
                group: "$1"
            create_groups: true
  # The edge of the dev cluster needs 0.2 to 1.8 s to drop a draining pod's endpoint on the CI runners, and 13.4 s on a laptop
  # whose CPUs are all taken (the drain tests measure it, docs/developer/e2e.md); the chart's 5 s fails on such a host, and
  # the chart's grace period of 120 s leaves 100 s after the delay (Q-HA-112).
  health:
    shutdown_drain_delay: 15s           # default 5s; must exceed the edge's endpoint removal time (R-HA-059)
  # The dev pods have 1Gi: smaller caches leave the memory slots to requests (Q-ARCH-243), about 860 instead of 90.
  cache:
    rendition_bytes: 64MiB              # default 256MiB
  proxy:
    metadata_cache_bytes: 32MiB         # default 128MiB
    merged_metadata_cache_bytes: 64MiB  # default 256MiB
  database:
    host: quader-db-rw.quader.svc         # the read-write Service of the CloudNativePG cluster quader-db
    name: quader
    ssl_mode: verify-full
  valkey:
    mode: sentinel
    sentinel:
      # The Valkey operator's names: <pod>.<headless Service>.<namespace>.svc.cluster.local, the only names
      # its certificate carries. The primary is named after the resource.
      addresses:
        - quader-valkey-sentinel-0.quader-valkey-sentinel-headless.quader.svc.cluster.local:36379
        - quader-valkey-sentinel-1.quader-valkey-sentinel-headless.quader.svc.cluster.local:36379
        - quader-valkey-sentinel-2.quader-valkey-sentinel-headless.quader.svc.cluster.local:36379
      primary_name: quader-valkey
      tls: true
    tls:
      mode: verify-full
  storage:
    s3:
      bucket: quader-blobs
      region: us-east-1
      endpoint: https://quader-s3.quader.svc:9000  # SeaweedFS over TLS; the certificate names quader-s3.quader.svc
      force_path_style: true
      credentials:
        source: static
    upload:
      max_size: 1GiB
  backup:
    target:
      bucket: quader-backups                       # a bucket of its own on the blob store's SeaweedFS, over TLS like every link of the profile
      region: us-east-1
      endpoint: https://quader-s3.quader.svc:9000
      force_path_style: true
      credentials:
        source: static
      sse:
        mode: none                                 # the dev SeaweedFS has no KMS and answers an SSE-S3 write with a 500 (R-BAK-026 probe)
    expected_interval: 6h                         # the schedule below

backup:
  enabled: true                  # the chart's default is off; this profile, and every e2e set layered on it, renders the CronJob
  schedule: "0 */6 * * *"

secrets:
  database:
    existingSecret: quader-db-app         # created by CloudNativePG
  databaseCA:
    existingSecret: quader-db-ca          # created by CloudNativePG
    key: ca.crt
  s3:
    existingSecret: quader-s3             # generated by the internal-secrets-operator (secrets.yaml)
  # Interim deviation from R-HA-056 / R-ARCH-031 (dev profile only): the Valkey operator has no ACL users and no
  # separate Sentinel password, so quader connects as the `default` user (empty usernameKey) with the cluster
  # password, and the same Secret authenticates against the Sentinels. See local-profile.md.
  valkey:
    existingSecret: quader-valkey-auth    # generated by the internal-secrets-operator
    usernameKey: ""
  valkeySentinel:
    existingSecret: quader-valkey-auth
  backupSource:
    existingSecret: quader-s3             # the profile has one SeaweedFS login; a production profile gives the backup a login that may only read quader-blobs
  backupTarget:
    existingSecret: quader-s3             # the same SeaweedFS login as the blob store; a production target has keys of its own
  s3CA:
    existingSecret: quader-s3-tls         # the SeaweedFS certificate Secret (cert-manager, dev CA); renders storage.s3.ca_file
    key: ca.crt
  backupTargetCA:
    existingSecret: quader-s3-tls         # the same certificate; renders backup.target.ca_file
    key: ca.crt
  valkeyCA:
    existingSecret: quader-valkey-tls     # the Valkey operator's certificate Secret (cert-manager, dev CA)
  encryption:
    existingSecret: quader-encryption-keys # generated by the internal-secrets-operator: 32 raw bytes
    keys: [dev.key]
  oidc:
    - providerId: keycloak
      existingSecret: quader-keycloak     # generated by the internal-secrets-operator (keycloak.yaml)
      key: client-secret
  breakGlass:
    existingSecret: quader-break-glass    # generated and rotated by the internal-secrets-operator (secrets.yaml)
    key: password

# The dev CA that signed Keycloak's certificate (Secret quader-keycloak-tls, keycloak.yaml): the outbound connection to
# the issuer trusts it through trustedCA (R-HA-043), in every pod of the release; the client secret and the break-glass
# password use secrets.oidc and secrets.breakGlass.
trustedCA:
  existingSecret: quader-keycloak-tls
  keys: [ca.crt]

# The edge: HAProxy Ingress (haproxy-values.yaml) terminates TLS with Secret quader-edge-tls for localhost and
# speaks HTTPS to quader, verifying each backend under its kind's name against the ca.crt of its kind's Secret (R-HA-063).
ingress:
  enabled: true
  className: haproxy
  tls:
    - secretName: quader-edge-tls
      hosts: [localhost]
  backendTLS:
    controller: haproxy
    verify: true

# The second endpoint (R-EP-001 to R-EP-005, E0.16, E1.14): `customers` listens on :8443 with its own host, its own
# certificate pair plus a wildcard pair chosen by SNI (all from cert-manager, pki.yaml), serves the package routes, the
# raw files and the management API (`surface: [packages, files, api]`, Q-EP-54: E1.14 needs the files and the
# listings of the management API under exposure; /ui/ is not allowed on a further endpoint and answers the 404 of an
# unknown path; the packages pods open :8443 for the packages and files families and the api pods for the api family, the
# Services are quader-ep-customers and quader-api-ep-customers and the edge splits the host by path), accepts only service-account tokens bound to it and exposes what its rules say (the chart's
# defaults for a further endpoint), and has its own Ingress on the same HAProxy Ingress, which verifies the endpoint's certificate for
# quader-ep-customers.<namespace>.svc. The host resolves to the loopback address on every system that treats
# *.localhost that way; the edge port follows QUADER_DEV_HTTP_PORT (up.sh sets baseUrl).
endpoints:
  customers:
    port: 8443
    baseUrl: https://packages.quader.localhost:8080
    hosts: [packages.quader.localhost]
    wildcardHost: "*.packages.quader.localhost"
    surface: [packages, files, api]
    trustedProxies: ["10.244.0.0/24"]     # the same HAProxy pods as the default endpoint
    tls:
      existingSecret: quader-customers-tls
      extraSecrets: [quader-customers-wildcard-tls]
    ingress:
      enabled: true
      className: haproxy
      tls:
        - secretName: quader-customers-edge-tls
          hosts: [packages.quader.localhost, "*.packages.quader.localhost"]
  # The bound host of the Docker Engine mirror (R-OCI-029, R-EP-006, R-EP-007): oci-mirror.quader.localhost answers /v2/ as the root of
  # the repository e2e/oci-engine-mirror, which the OCI e2e set creates (a binding to a repository that does not exist is no binding). A Docker Engine
  # names the host in registry-mirrors and pulls without a login, so the endpoint admits anonymous requests; the repository grants
  # `read` to anonymous only while a test needs it. The host resolves to the loopback address on every system that treats *.localhost
  # that way, and in the OCI client pods through hostAliases (deploy/dev/oci-clients.yaml); the edge port follows QUADER_DEV_HTTP_PORT.
  ocimirror:
    port: 8444
    baseUrl: https://oci-mirror.quader.localhost:8080
    hosts: [oci-mirror.quader.localhost]
    hostRoots:
      oci-mirror.quader.localhost: e2e/oci-engine-mirror
    surface: [packages]
    auth: {tokenTypes: [pat, sat], boundTokensOnly: false, anonymous: true}
    exposure: all
    cacheFill: true                       # a pull through the mirror host fills the remote's cache (a further endpoint does not by default)
    trustedProxies: ["10.244.0.0/24"]     # the same HAProxy pods as the default endpoint
    tls:
      existingSecret: quader-ocimirror-tls
    ingress:
      enabled: true
      className: haproxy
      tls:
        - secretName: quader-ocimirror-edge-tls
          hosts: [oci-mirror.quader.localhost]
