# Pooler overlay (`QUADER_POOLER=1 deploy/dev/up.sh`, R-HA-051, R-HA-058, R-HA-059 rule 5): two CloudNativePG
# Pooler resources in transaction mode with two instances each, one for the request pool and one for the control
# connection. values-pooler.yaml points the chart at them.
#
# What the drain of a pooler instance (variant D of R-HA-059) needs, per Pooler: the instances on different nodes
# (a hostname spread with DoNotSchedule; nodeTaintsPolicy Honor keeps the tainted control-plane node out of the
# skew), a PodDisruptionBudget (the operator adds none), and a stop that waits until quader has moved its connections
# to the other instance. The wait is a preStop sleep of 90 s, not PgBouncer's SIGTERM: the CloudNativePG pooler
# manager turns SIGTERM into SIGINT ("waiting for all servers connections to be released"), which drops every idle
# client connection at once. During the sleep the pod is out of the Service, so quader's new connections reach the
# other instance, and its own connections age out within lifetime + jitter + health check period
# (values-pooler.yaml: 60s + 15s + 5s = 80 s). The grace period of 120 s covers the sleep and the shutdown.
#
# The server connections of the four pool sizes are 2 x 20 + 2 x 4 = 48, which values-pooler.yaml declares.
#
# What a PostgreSQL switchover behind the poolers needs (R-HA-058, Q-HA-302): server_login_retry of 1 s. After a failed server
# login PgBouncer refuses every client for server_login_retry (15 s by default) without trying again. A switchover fails the login
# twice: once while the old primary stops, and once more on the new primary, whose instance manager sets the application password
# again with a new SCRAM salt, so the keys PgBouncer keeps from its long-lived clients no longer match. With the default that was
# 30 s in which every replica's database check failed and the edge answered 503 for everything; with 1 s the poolers serve again
# about a second after the new primary does.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: quader-db-pooler-rw
spec:
  cluster:
    name: quader-db
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      default_pool_size: "20"
      max_client_conn: "500"
      server_login_retry: "1"
  template:
    metadata:
      labels:
        quader/pooler: quader-db-pooler-rw
    spec:
      containers:
        - name: pgbouncer
          lifecycle:
            preStop:
              sleep:
                seconds: 90
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              quader/pooler: quader-db-pooler-rw
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: quader-db-pooler-control
spec:
  cluster:
    name: quader-db
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      default_pool_size: "4"
      max_client_conn: "100"
      server_login_retry: "1"
  template:
    metadata:
      labels:
        quader/pooler: quader-db-pooler-control
    spec:
      containers:
        - name: pgbouncer
          lifecycle:
            preStop:
              sleep:
                seconds: 90
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              quader/pooler: quader-db-pooler-control
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quader-db-pooler-rw
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      quader/pooler: quader-db-pooler-rw
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quader-db-pooler-control
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      quader/pooler: quader-db-pooler-control
