# The dev PKI (R-ARCH-035, R-HA-063): one self-signed root and the Issuer quader-dev-ca that signs every
# certificate of the profile. cert-manager issues, renews and re-issues them; nothing is made by hand.
#
#   quader-dev-ca        the root (Secret quader-dev-ca; ca.crt is what a client trusts, see local-profile.md)
#   (quader-tls-<kind>)  quader's own listeners are not issued here: the chart issues a pair per kind of pod (api,
#                        packages, worker, vuln-scanner-trivy, malware-scanner-clamav) from the Issuer quader-dev-ca (values-dev.yaml tls.certManager), each
#                        for quader-<kind>.<ns>.svc and quader-ops.<ns>.svc, and HAProxy Ingress verifies each backend
#                        under its kind's name.
#   quader-edge-tls      the edge's certificate for clients on the host (https://localhost:<port>)
#   quader-s3-tls        the SeaweedFS S3 endpoint (https://quader-s3.quader.svc:9000)
#   quader-customers-tls            the endpoint `customers` (values-dev.yaml endpoints.customers): its exact host and
#                                   the Service names the edge verifies, quader-ep-customers.<ns>.svc (packages pods)
#                                   and quader-api-ep-customers.<ns>.svc (api pods)
#   quader-customers-wildcard-tls   the endpoint's wildcard pair (extraSecrets), chosen by SNI
#   quader-customers-edge-tls       the edge's certificate for the endpoint's host and its wildcard
#   quader-ocimirror-tls            the endpoint `ocimirror` (values-dev.yaml endpoints.ocimirror, the bound host of the Docker Engine
#                                   mirror, R-OCI-029): its host and the Service name the edge verifies, quader-ep-ocimirror.<ns>.svc
#   quader-ocimirror-edge-tls       the edge's certificate for the endpoint's host
#   <name>-tls           the Valkey operator's own Certificate for the Valkey CR (valkey.yaml, one for both tiers)
#
# The Issuer is namespaced in the release namespace, so a namespace other than `quader` needs the names below
# to follow (kubectl apply of this file goes to -n $NS).
#
# The root comes first: up.sh applies the three objects labelled quader-dev/pki=root (the self-signed Issuer, the root and the CA
# Issuer), waits until the root's Certificate and the CA Issuer are Ready, and only then applies the leaves. Applied together, the
# root was issued twice at a start (the certificate operator's log of a red `e2e (ci)`: 16:28:35.29 and again at .60), and five
# leaves signed with the first key in between, the edge's among them, which no client of the second root trusts.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: quader-dev-selfsigned
  labels:
    quader-dev/pki: root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quader-dev-ca
  labels:
    quader-dev/pki: root
spec:
  isCA: true
  commonName: quader dev CA
  secretName: quader-dev-ca
  duration: 87600h          # ten years: the root outlives every cluster built from it
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: quader-dev-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: quader-dev-ca
  labels:
    quader-dev/pki: root
spec:
  ca:
    secretName: quader-dev-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quader-edge-tls
spec:
  secretName: quader-edge-tls
  commonName: localhost
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - localhost
  ipAddresses:
    - 127.0.0.1
    - ::1
  issuerRef:
    name: quader-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quader-s3-tls
spec:
  secretName: quader-s3-tls
  commonName: quader-s3
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - quader-s3
    - quader-s3.${NS}
    - quader-s3.${NS}.svc
    - quader-s3.${NS}.svc.cluster.local
    - localhost
  issuerRef:
    name: quader-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quader-customers-tls
spec:
  secretName: quader-customers-tls
  commonName: packages.quader.localhost
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - packages.quader.localhost
    - quader-ep-customers
    - quader-ep-customers.${NS}
    - quader-ep-customers.${NS}.svc
    - quader-ep-customers.${NS}.svc.cluster.local
    - quader-api-ep-customers
    - quader-api-ep-customers.${NS}
    - quader-api-ep-customers.${NS}.svc
    - quader-api-ep-customers.${NS}.svc.cluster.local
  issuerRef:
    name: quader-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quader-customers-wildcard-tls
spec:
  secretName: quader-customers-wildcard-tls
  commonName: "*.packages.quader.localhost"
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - "*.packages.quader.localhost"
  issuerRef:
    name: quader-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quader-customers-edge-tls
spec:
  secretName: quader-customers-edge-tls
  commonName: packages.quader.localhost
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - packages.quader.localhost
    - "*.packages.quader.localhost"
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: quader-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quader-ocimirror-tls
spec:
  secretName: quader-ocimirror-tls
  commonName: oci-mirror.quader.localhost
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - oci-mirror.quader.localhost
    - quader-ep-ocimirror
    - quader-ep-ocimirror.${NS}
    - quader-ep-ocimirror.${NS}.svc
    - quader-ep-ocimirror.${NS}.svc.cluster.local
  issuerRef:
    name: quader-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quader-ocimirror-edge-tls
spec:
  secretName: quader-ocimirror-edge-tls
  commonName: oci-mirror.quader.localhost
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - oci-mirror.quader.localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: quader-dev-ca
    kind: Issuer
    group: cert-manager.io
