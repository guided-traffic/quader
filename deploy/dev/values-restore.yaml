# Chart values of the restore drill's installation (R-BAK-021, R-HA-060, deploy/dev/restore-ns.sh): the same chart as the main
# dev profile in the namespace ${RESTORE_NS}, against the database, the Valkey and the empty bucket restore-ns.yaml sets up, the
# dev SeaweedFS of the namespace ${NS} and, as the backup target to restore from, that SeaweedFS's bucket quader-backups with the
# target of the source installation (the same location the source's CronJob writes to). The release is installed first with
# restore.enabled and no replica, then upgraded with web and worker replicas (restore-ns.sh).
#
# No edge, no identity provider and no second endpoint: the drill reaches the restored installation through port-forwards to its
# Services, with the dev CA that signs the pairs the chart issues in this namespace (R-HA-063).
image:
  registry: docker.io
  repository: guidedtraffic/quader
  tag: dev
  pullPolicy: IfNotPresent

highAvailability:
  enforce: false                 # one replica per role; the restore Job also requires it off (R-BAK-021)

tls:
  enabled: true
  certManager:
    issuerRef:
      name: quader-dev-ca              # the dev CA's Issuer of this namespace (restore-ns.yaml)
      kind: Issuer
    extraDnsNames: [localhost]         # the drill reaches single pods through port-forwards under localhost
    extraIpAddresses: [127.0.0.1]

api:
  replicaCount: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 128Mi}
    limits: {memory: 1Gi}
packages:
  replicaCount: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 128Mi}
    limits: {memory: 1Gi}
worker:
  replicaCount: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 128Mi}
    limits: {memory: 512Mi}

# The dev CA: the copy of quader-s3-tls in this namespace carries only the CA certificate in ca.crt (restore-ns.sh), not the CA's key. A
# restored CI issuer (caBundleRef) and the test advisory source verify against it; the chart mounts it in every pod of the release, the Jobs
# included, so it cannot be a Secret the release's own Certificates make: the hook Jobs run before they exist.
trustedCA:
  existingSecret: quader-s3-tls
  keys: [ca.crt]

restore:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

backup:
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}

config:
  server:
    base_url: https://localhost:8080          # restore-ns.sh replaces it with the source's (its edge port): with the same base URL the restored tokens keep working (R-BAK-021)
    replica_header: always
  log:
    level: debug
  api:
    rate_limits:
      anonymous:
        requests_per_second: 1000
        burst: 10000
  # The image scanning is off, as in values-dev.yaml (Q-HA-382): the drills judge no image's scan, so the restored installation starts
  # no scanner pod and no node pulls the analyser's image (R-HA-070).
  vulnerabilities:
    sources:
      osv:
        mode: "off"
      kev:
        mode: "off"
    images:
      enabled: false
  # The image scanning's database is not fetched on a schedule either, as in values-dev.yaml (R-VULN-044).
  maintenance:
    tasks:
      vuln-sync-trivy-db: {enabled: false, schedule: "23 */6 * * *"}
  system:
    bootstrap_anonymous_read: true
  health:
    shutdown_drain_delay: 5s
  cache:
    rendition_bytes: 64MiB              # the dev pods have 1Gi, as in values-dev.yaml
  proxy:
    metadata_cache_bytes: 32MiB
    merged_metadata_cache_bytes: 64MiB
  database:
    host: quader-db-rw.${RESTORE_NS}.svc
    name: quader
    ssl_mode: verify-full
  valkey:
    mode: sentinel
    sentinel:
      addresses:
        - restore-valkey-sentinel-0.restore-valkey-sentinel-headless.${RESTORE_NS}.svc.cluster.local:36379
        - restore-valkey-sentinel-1.restore-valkey-sentinel-headless.${RESTORE_NS}.svc.cluster.local:36379
        - restore-valkey-sentinel-2.restore-valkey-sentinel-headless.${RESTORE_NS}.svc.cluster.local:36379
      primary_name: restore-valkey
      tls: true
    tls:
      mode: verify-full
  storage:
    s3:
      bucket: quader-restore-blobs              # the empty bucket of restore-ns.yaml
      region: us-east-1
      endpoint: https://quader-s3.${NS}.svc:9000
      force_path_style: true
      credentials:
        source: static
    upload:
      max_size: 1GiB
  backup:
    target:
      bucket: quader-backups                    # where the source installation writes its backups
      region: us-east-1
      endpoint: https://quader-s3.${NS}.svc:9000
      force_path_style: true
      credentials:
        source: static
      sse:
        mode: none                              # as the source: the dev SeaweedFS has no KMS

secrets:
  database:
    existingSecret: quader-db-app
  databaseCA:
    existingSecret: quader-db-ca
    key: ca.crt
  s3:
    existingSecret: quader-s3
  backupSource:
    existingSecret: quader-s3                   # backup.enabled with static S3 keys needs the backup's own blob login (Q-BAK-49); the profile has one SeaweedFS login
  backupTarget:
    existingSecret: quader-s3
  s3CA:
    existingSecret: quader-s3-tls
    key: ca.crt
  backupTargetCA:
    existingSecret: quader-s3-tls
    key: ca.crt
  valkey:
    existingSecret: restore-valkey-auth
    usernameKey: ""
  valkeySentinel:
    existingSecret: restore-valkey-auth
  valkeyCA:
    existingSecret: restore-valkey-tls
  encryption:
    existingSecret: quader-encryption-keys      # a copy of the source's: the restore opens its canary rows with it (R-BAK-020 check 3)
    keys: [dev.key]
