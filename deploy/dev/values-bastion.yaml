# The `bastion` e2e profile (R-BAS-049), layered after values-dev.yaml by up.sh when QUADER_PROFILE=bastion: the settings the
# main installation needs for the Bastions of deploy/dev/bastion.sh (R-BAS-017, R-BAS-010). The profile `oci` (R-BAS-060) layers it after
# values-scatter.yaml for the one Bastion of the set oci, with that Bastion's base URL in place of the two below.
#
# The networks the Bastions connect from are no value of this file: they are a member of each registration (R-BAS-017, Q-BAS-334),
# which the e2e test sets when it registers a Bastion (basEgress in test/e2e/bastion_env_test.go: the pod subnet of kind.yaml, since
# the Bastion's pods call the main endpoint directly from the pod range of whichever worker node they run on). The main installation
# honours the caller's address and host a Bastion forwards only on a request whose Bastion token was recognized and whose peer is in
# its registration's list. (They are not listed in server.trusted_proxies, which stays the edge's range of values-dev.yaml.)
#
# server.additional_base_urls: the hosts the Bastions call the main endpoint on (the Service names https://quader-api.quader.svc:8080 and
# https://quader-packages.quader.svc:8080: the main installation answers 421 for a host it does not serve, also on the interface routes) and the two Bastion base URLs, https://bastion-volume.quader.localhost:<edge port> and
# https://bastion-bucket.quader.localhost:<edge port>; up.sh passes them with --set-json because the edge port follows
# QUADER_DEV_HTTP_PORT.
