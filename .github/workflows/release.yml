# Test and Release: the pipeline of every push to main and every pull request. Every check is a job
# of its own, and every job calls a Makefile target (or a command that the Makefile would run), so a
# failure reproduces on a laptop with the same command. Semantic Release needs the set of jobs named at that job
# (Q-ARCH-457): on main it cuts the release from the conventional commits since the last tag (.releaserc.json), and the
# release's "published" event starts build.yml (Release Docker & Helm). What each job runs and how to
# reproduce it: docs/developer/releasing.md#ci.
#
# What runs per change: every check above, the e2e legs push and access-long, the GitLab CI OIDC leg (e2e-ci, set ci) and the
# layout checks of every screen of the UI (ui-layout). Of the formats' acceptance legs (e2e-npm, e2e-nuget, e2e-oci, e2e-deb,
# e2e-ansible) a push runs the leg of each format whose own paths it changed, and the reference leg npm when it changed shared code;
# every other format's set runs in the nightly (owner, 2026-11-20). The Bastion and vulnerability legs run when their paths
# changed. Job e2e-scope decides once per run, for a push and a pull request alike; a dispatch runs every leg. The long legs failover and npm-ha are
# not here: they run nightly and on dispatch in performance.yml ("HA and Performance (nightly)"), outside the release path (owner,
# 2026-11-01); npm-ha-crash runs by hand (make e2e SET=npm-ha-crash).
# A red long leg is recorded as an open finding and does not hold the release.
#
# Runners (owner, 2026-11-05): the kind legs push, access-long, npm, oci, deb and ansible run on the organisation's large runners
# (runs-on: large); the kind legs that load the NuGet clients image (e2e-nuget, e2e-ci, e2e-bastion, e2e-vuln) need
# more than the 30 GiB of Docker storage a large pod has and run on GitHub-hosted runners (runs-on: ubuntu-24.04);
# every other job runs on the standard runners (runs-on: self-hosted). Sizes: docs/developer/releasing.md#ci.
name: Test and Release

on:
  push:
    branches:
      - main
    # A change of documentation alone starts no run (owner, 2026-11-17). The manual under docs/manual is part of the
    # binary and the guides under internal/ are code, so both still start one; "*.md" matches the files at the root only.
    paths:
      - "**"
      - "!docs/**"
      - "docs/manual/**"
      - "!*.md"
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - "!docs/**"
      - "docs/manual/**"
      - "!*.md"
  workflow_dispatch:
    inputs:
      closing:
        description: >-
          The full run on the commit that closes a phase (Q-NPM-46): adds the legs the roadmap reserves for it, the npm
          scenario list and cold-cache install with Valkey stopped, the read-only subset against the public registry, the
          5-minute Valkey outage under the npm load, the NuGet closing leg (nuget-closing), and the 30-minute fuzz runs of
          npm's Match and Inspect, of the NuGet readers and version rules and of the reader of a NuGet signature. Choose the
          closing commit as the ref of the run.
        type: boolean
        default: false

# A run of main is never cancelled or replaced (Q-ARCH-594): its group is the run's own, so a newer push to main runs beside it
# and the older run keeps its integration shards, e2e legs and layout checks. A pull request, and a dispatch on another branch,
# keep one group per ref and cancel their own earlier run. Two runs of main may reach Semantic Release; only the run of the commit
# at the tip of main releases (semantic-release publishes nothing from a commit main has moved past), and it releases every
# commit since the last tag. No job of this file has a concurrency group of its own: a group shared by runs of main would let
# GitHub cancel a waiting job of one run for another's (internal/tools/ciworkflows TestARunOfMainIsNeverCancelledByAnother).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The runner pods have no CPU limit, so every tool would see the node's 32 cores and start that many threads on a node that other
  # jobs share; the time bounds of the tests would then measure the node. Owner, 2026-11-10: limit the tools, not the pods.
  GOMAXPROCS: "8"
  NG_BUILD_MAX_WORKERS: "8"
  VITEST_MAX_WORKERS: "8"

jobs:
  # One version per tool (E0.2): the Makefile compares go, node, sqlc, oapi-codegen and every CI tool
  # on PATH with its pin. The runner image's own helm, kubectl and kind are replaced by the pinned
  # ones first, so that the check looks at those.
  versions:
    name: versions
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install the shared library the pinned Node.js loads
        timeout-minutes: 9
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          .github/scripts/apt-install.sh libatomic1

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the pinned helm
        timeout-minutes: 5
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        timeout-minutes: 5
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: kind
          package: sigs.k8s.io/kind
          version: ${{ env.KIND_VERSION }}
          bin: 'true'

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}
          download-budget: '600'

      - name: Show the tool versions in the log
        run: |
          set -euo pipefail
          go version
          node --version
          helm version --short
          kubectl version --client
          kind version
          docker buildx version

      - name: make versions-check
        run: make versions-check

  lint:
    name: Code Linting
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Restore or build the pinned golangci-lint
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: golangci-lint
          package: github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: make lint
        run: make lint

  gosec:
    name: GoSec Security Scan
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Restore or build the pinned golangci-lint
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: golangci-lint
          package: github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: make gosec
        run: make gosec

  govulncheck:
    name: Vulnerability Check
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Restore or build the pinned govulncheck
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: govulncheck
          package: golang.org/x/vuln/cmd/govulncheck
          version: ${{ env.GOVULNCHECK_VERSION }}

      - name: make vuln
        run: make vuln

  cyclomatic-complexity:
    name: Cyclomatic Complexity
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Restore or build the pinned gocyclo
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: gocyclo
          package: github.com/fzipp/gocyclo/cmd/gocyclo
          version: ${{ env.GOCYCLO_VERSION }}

      - name: make cyclo
        run: make cyclo

      - name: Complexity report
        if: always()
        run: |
          {
            echo "## Cyclomatic complexity"
            echo
            echo "Threshold: $(sed -n -E 's/^CYCLO_THRESHOLD *\?= *([0-9]+).*/\1/p' Makefile) (no function above it). The 20 most complex functions:"
            echo
            echo '```'
            make -s cyclo-report
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # The generated code (sqlc, oapi-codegen, the config schema) regenerated and compared with the tree.
  generate:
    name: generate
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: make generate-check
        run: make generate-check

      # The reference solution of the NuGet tests (perf/nuget/reference) regenerated from the counting upstream's package
      # set and compared with the committed files (Q-ARCH-279).
      - name: make nuget-reference-check
        run: make nuget-reference-check

  # The golden vectors of the NuGet version, range and ID rules regenerated with NuGet.Versioning in the pinned
  # .NET SDK image (tools/nugetvectors, R-NUGET-003) and compared with the committed file.
  nuget-vectors:
    name: nuget vectors
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: make nuget-vectors-check
        run: make nuget-vectors-check

  build-no-node:
    name: build without Node.js
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools
        with:
          commands: file

      - name: Build with Node.js off PATH and check the binary
        run: |
          set -euo pipefail
          # The runner image puts Node.js on PATH. Drop every PATH entry that holds a Node.js
          # executable, then check that no Node.js executable resolves and that the build tools
          # survived the trimming.
          trimmed=""
          IFS=: read -r -a dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            [ -n "$d" ] || continue
            if [ -e "$d/node" ] || [ -e "$d/npm" ] || [ -e "$d/npx" ] || [ -e "$d/corepack" ]; then
              echo "dropping $d from PATH (it holds a Node.js executable)"
              continue
            fi
            trimmed="${trimmed:+$trimmed:}$d"
          done
          export PATH="$trimmed"
          for tool in node npm npx corepack; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool still resolves to $(command -v "$tool")"
              exit 1
            fi
          done
          for tool in go make git file; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on the trimmed PATH"
              exit 1
            fi
          done
          go version
          make build
          desc="$(file bin/quader)"
          echo "$desc"
          case "$desc" in
            *"statically linked"*) ;;
            *) echo "::error::bin/quader is not statically linked"; exit 1 ;;
          esac
          if ! go version -m bin/quader | grep -q 'CGO_ENABLED=0'; then
            echo "::error::bin/quader was not built with CGO_ENABLED=0"
            exit 1
          fi

  unit:
    name: unit tests
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: make test
        run: make test

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-unit
          path: .out/test-unit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the unit coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-unit
          path: .out/coverage/unit.out
          if-no-files-found: warn
          retention-days: 14

  web:
    name: web (Angular)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the shared library the pinned Node.js loads
        timeout-minutes: 9
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          .github/scripts/apt-install.sh libatomic1

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      # npm ci installs exactly package-lock.json and fails when package.json and the lockfile
      # disagree (E0.2: the Angular packages must match the lockfile).
      - name: make web-ci
        run: make web-ci

      - name: make web-lint (ESLint and the project rules)
        run: make web-lint

      - name: make web-test
        run: make web-test

      # The JUnit report of the Angular unit tests (angular.json), the evidence of the R-UI requirements the specs name.
      - name: Upload the Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-web
          path: |
            .out/test-web.xml
            .out/test-web-lint.xml
          if-no-files-found: warn
          retention-days: 14

      - name: make web-embed (build and embed into internal/webui)
        run: make web-embed

      # The notices of the bundled software in the embedded build (R-UI-001, Q-UI-144). Only this job holds a built UI;
      # the unit job runs the same test on the placeholder, where it is skipped.
      - name: go test of the embedded notices
        run: QUADER_UI_BUILT=1 go test -count=1 -run 'TestR_UI_001_ThirdPartyNotices' ./internal/webui/

  # The layout checks of the renders (R-UI-170 to R-UI-176; owner, 2026-11-19: "Ja, die Renderprüfung soll auch in der CI
  # laufen."): first on their own fixture pages, then every screen of the render set as every kind of user, at three widths;
  # a finding fails the job. The UI development profile is the job's own (deploy/ui-dev: three service containers in the
  # runner's Docker, Quader with the sign-in provider, the Angular dev server). Not among the needs of Semantic Release until
  # the first stable release (Q-ARCH-457, Q-ARCH-510): a red run is a finding to fix, not a held release. One leg: a full run
  # took 22 minutes on the development machine (Q-ARCH-511). Runner, legs and evidence: docs/developer/releasing.md#ci.
  ui-layout:
    name: UI layout checks
    runs-on: self-hosted
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the shared library the pinned Node.js loads
        timeout-minutes: 9
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          .github/scripts/apt-install.sh libatomic1

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools
        with:
          commands: curl

      - name: Install the Docker Compose plugin (the UI development services)
        timeout-minutes: 9
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || .github/scripts/apt-install.sh docker-compose-v2
          docker compose version

      - name: Log in to Docker Hub (service image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Install the web workspace and the browser
        timeout-minutes: 25
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          # The browser build is the one the locked @playwright/test version names (one version per tool), through the
          # script that installs its system libraries only where they are missing.
          ../.github/scripts/playwright-install.sh chromium

      - name: Check the layout checks on their fixture pages
        run: make ui-layout-test

      - name: Render every screen and check its layout
        run: make ui-renders

      # The evidence of a red run: the findings, the report and the pictures of the screens that failed, as an artifact of a
      # short life; the renders are never committed. A green run keeps the report alone.
      - name: Collect the pictures of the failed screens
        if: failure()
        run: |
          set -euo pipefail
          out=.out/ui-layout-evidence
          mkdir -p "$out"
          cp .out/ui-renders/failures.txt .out/ui-renders/report.json "$out/" 2>/dev/null || true
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = ".out/ui-renders/.manifest";
            if (!fs.existsSync(dir)) process.exit(0);
            for (const f of fs.readdirSync(dir)) {
              const m = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              if (m.failures.length > 0) for (const s of m.shots) console.log(s.file);
            }' | while read -r file; do
            mkdir -p "$out/$(dirname "$file")"
            cp ".out/ui-renders/$file" "$out/$file" 2>/dev/null || true
          done
          # What Playwright kept of each failed screen: the page as it stood and the call that stopped it.
          if [ -d .out/ui-renders/.results ]; then
            (cd .out/ui-renders/.results && find . -name 'error-context.md' -print | while read -r file; do
              mkdir -p "../../ui-layout-evidence/results/$(dirname "$file")"
              cp "$file" "../../ui-layout-evidence/results/$file"
            done)
          fi

      - name: Upload the findings and the pictures of the failed screens
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-layout-findings
          path: .out/ui-layout-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the render report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ui-layout-report
          path: .out/ui-renders/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Logs of Quader, the dev server and the services (failure only)
        if: failure()
        run: |
          tail -n 200 .out/ui-renders.backend.log .out/ui-renders.web.log 2>/dev/null || true
          for c in $(docker ps -a --filter "name=quader-ui-dev-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 200 || true
            echo "::endgroup::"
          done

      - name: Stop the UI development services and remove their data
        if: always()
        run: make ui-dev-down PURGE=1

  malware-scan:
    name: Malware Scan (source code)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Log in to Docker Hub (the ClamAV image)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      # The product's ClamAV (CLAMAV_IMAGE) runs freshclam and clamscan (R-MAL-031). Its database lives in a cache whose key changes
      # once a day: a run restores the newest one and fetches the day's differences, ClamAV's network sees one whole download per
      # cache eviction and no more.
      - name: The day of the ClamAV database
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the ClamAV database
        id: clamav_db
        timeout-minutes: 5
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        with:
          path: .out/clamav-db
          key: clamav-db-${{ steps.day.outputs.day }}
          restore-keys: clamav-db-

      - name: Update the ClamAV database
        timeout-minutes: 5
        run: make malware-scan-db

      - name: Save the ClamAV database of the day
        if: steps.clamav_db.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .out/clamav-db
          key: clamav-db-${{ steps.day.outputs.day }}

      - name: make malware-scan
        run: make malware-scan

      - name: Upload the ClamAV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clamav-report
          path: .out/clamav-report.txt
          if-no-files-found: warn
          retention-days: 30

  chart:
    name: chart
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Install the pinned helm
        timeout-minutes: 5
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        timeout-minutes: 5
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Check the installed versions against the pins
        run: |
          set -euo pipefail
          test "$(helm version --template '{{.Version}}')" = "$HELM_VERSION"
          kubectl version --client -o json | grep -q "\"gitVersion\": \"$KUBECTL_VERSION\""

      - name: make chart-lint
        run: make chart-lint

      - name: Fetch the pinned promtool
        timeout-minutes: 16
        env:
          # The chart job is 20 minutes long: the download gets 10 of them, and the named error comes first.
          QUADER_DOWNLOAD_BUDGET: "600"
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make promtool

      - name: make chart-test
        run: make chart-test

      - name: Upload the chart render report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-chart
          path: .out/test-chart.json
          if-no-files-found: warn
          retention-days: 14

  # The release image as build.yml builds it, for the host architecture only: the image runs as the
  # non-root UID of R-HA-033. The kind legs of the run need this job and load its image from the artifact quader-image.
  image:
    name: image (host architecture, no push)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (base image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      # Built as the kind legs deploy it (guidedtraffic/quader:dev, VERSION=dev): they load this image from the artifact quader-image
      # instead of building the Containerfile again (Q-ARCH-522).
      - name: make image
        run: make image IMAGE=guidedtraffic/quader:dev VERSION=dev

      - name: The image runs as a non-root user
        run: |
          set -euo pipefail
          user="$(docker image inspect guidedtraffic/quader:dev --format '{{.Config.User}}')"
          echo "user: $user"
          test "$user" = "65532:65532"

      - name: Save the image for the kind legs
        run: |
          set -euo pipefail
          mkdir -p .out
          docker save -o .out/quader-image.tar guidedtraffic/quader:dev

      - name: Upload the image for the kind legs
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: quader-image
          path: .out/quader-image.tar
          if-no-files-found: error
          retention-days: 1

  # The SBOM generator of the release image (Q-HA-166, tools/sbom-generator): builds it at the syft pin, builds a two-platform
  # test image with it as the BuildKit SBOM generator (written to a file, nothing pushed to a public registry) and asserts that
  # both attestations name the pinned syft. A syft bump that breaks the generator fails here, before any release; the job is
  # a need of semantic-release below. It pulls public images anonymously and holds no secret.
  sbom-generator:
    name: SBOM generator (pinned syft, test image)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Install make and jq
        timeout-minutes: 9
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: make sbom-generator-check
        run: make sbom-generator-check

  # Trivy on the built image, as valkey-operator's container job runs it: vulnerabilities of the OS
  # and the libraries (fixed ones only), secrets and misconfigurations. A finding of CRITICAL or HIGH
  # fails the job.
  container-scan:
    name: Container Scan (Trivy, built image)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (base and analyser image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make image (for the scan)
        run: make image IMAGE=quader:scan

      # The scanner's own analyser: make trivy takes the binary out of TRIVY_IMAGE of tools/versions.env by its index digest (the
      # image the chart's init container copies into every scanner pod, R-HA-070) and checks that it names the pin's tag; trivy-action
      # then installs nothing (skip-setup-trivy), so the scan does not depend on setup-trivy's cache or its silent download.
      - name: Install the pinned Trivy
        timeout-minutes: 16
        id: trivy_install
        run: |
          set -euo pipefail
          make trivy
          echo "$PWD/$(make -s trivy-dir)" >> "$GITHUB_PATH"

      # .trivyignore.yaml: the findings accepted for a time, each with its path in the image and the day it ends.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: quader:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
          skip-setup-trivy: true

      # Runs after a failed scan too (the report is wanted), but not when the Trivy install failed: then no trivy is on PATH,
      # and this step would add an exit 127 beside the install's own failure, which is the cause.
      - name: Run Trivy scan (SARIF output)
        if: always() && steps.trivy_install.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: quader:scan
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret,misconfig
          skip-setup-trivy: true

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-report
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30

  # The images the chart runs and Quader does not build (H-1003, H-1109, Q-ARCH-596): the analyser of the image scanning
  # (TRIVY_IMAGE) and ClamAV (CLAMAV_IMAGE), by the digests tools/versions.env pins and the chart's values hold to. The job
  # reports and gates nothing: Semantic Release does not need it and a finding does not fail it, because a finding in an
  # upstream build is fixed by the publisher and a raise of the pin, not in this repository, and must not hold Quader's releases.
  # The findings of CRITICAL or HIGH with a fix go into the job summary, with a warning per image, and as SARIF into the artifact
  # trivy-upstream-report beside trivy-container-report. .trivyignore-upstream.yaml takes out what is decided not to apply.
  upstream-image-scan:
    name: Container Scan (Trivy, images the chart runs)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # The Makefile lists the integration packages when make starts, which reads every module of go.sum.
      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        timeout-minutes: 9
        uses: ./.github/actions/build-tools

      - name: Install jq for the summary
        timeout-minutes: 9
        run: .github/scripts/apt-install.sh jq

      - name: Log in to Docker Hub (the scanned images and the analyser)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Install the pinned Trivy
        timeout-minutes: 10
        id: trivy_install
        run: |
          set -euo pipefail
          make trivy
          echo "$PWD/$(make -s trivy-dir)" >> "$GITHUB_PATH"

      - name: Scan the analyser's image
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore-upstream.yaml
        with:
          image-ref: ${{ env.TRIVY_IMAGE }}
          format: json
          output: trivy-upstream-analyser.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-setup-trivy: true

      - name: Scan the ClamAV image
        if: always() && steps.trivy_install.outcome == 'success'
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore-upstream.yaml
        with:
          image-ref: ${{ env.CLAMAV_IMAGE }}
          format: json
          output: trivy-upstream-clamav.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-setup-trivy: true

      # TRIVY_IMAGE and CLAMAV_IMAGE are in the job's environment through load-pins.
      - name: The findings in the job summary
        if: always()
        timeout-minutes: 5
        run: |
          .github/scripts/upstream-image-report.sh \
            analyser "$TRIVY_IMAGE" trivy-upstream-analyser.json \
            clamav "$CLAMAV_IMAGE" trivy-upstream-clamav.json

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-upstream-report
          path: trivy-upstream-*.sarif
          if-no-files-found: warn
          retention-days: 30

  integration:
    # Valkey 9.1 only: quader is in development and guarantees no older line (owner, 2026-10-29). The packages run in four
    # shards with a stack each (make test-integration SHARD=a|b|c|d, the rule in the Makefile, Q-ARCH-544, Q-ARCH-565). A shard
    # that is stopped by its limit or passes 43.5 minutes is cut again by that rule; the limit is not raised.
    name: integration (shard ${{ matrix.shard }})
    runs-on: self-hosted
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, d]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        uses: ./.github/actions/build-tools

      - name: Install the Docker Compose plugin (the integration stack)
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || .github/scripts/apt-install.sh docker-compose-v2
          docker compose version

      - name: Log in to Docker Hub (stack image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make integration-up
        run: make integration-up

      - name: make test-integration SHARD=${{ matrix.shard }}
        run: make test-integration SHARD=${{ matrix.shard }}

      # The OCI distribution conformance suite (R-OCI-035) on the stack of shard c: built from the pinned tag by the job's Go, run
      # against one replica through a local and a virtual repository.
      - name: make oci-conformance
        if: matrix.shard == 'c'
        run: make oci-conformance

      - name: Upload the OCI conformance reports
        if: always() && matrix.shard == 'c'
        uses: actions/upload-artifact@v7
        with:
          name: oci-conformance-junit
          path: |
            .out/oci-conformance/local/junit.xml
            .out/oci-conformance/local/report.html
            .out/oci-conformance/local/output.txt
            .out/oci-conformance/virtual/junit.xml
            .out/oci-conformance/virtual/report.html
            .out/oci-conformance/virtual/output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-integration-${{ matrix.shard }}
          path: .out/test-integration-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the integration coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-integration-${{ matrix.shard }}
          path: .out/coverage/integration-9.1-${{ matrix.shard }}.out
          if-no-files-found: warn
          retention-days: 14

      - name: Container logs (failure only)
        if: failure()
        run: |
          docker compose -f test/integration/compose.yaml ps -a || true
          for c in $(docker ps -a --filter "name=quader-it-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 300 || true
            echo "::endgroup::"
          done

      - name: make integration-down
        if: always()
        run: make integration-down

  # S3 conformance (R-STOR-035) against Silo (SILO_IMAGE), served over TLS only (INV-20).
  s3-conformance:
    name: S3 conformance
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install make and jq
        run: |
          .github/scripts/apt-install.sh make jq

      - name: Log in to Docker Hub (the openssl and Silo images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make silo-up (serve Silo over TLS and seed the buckets)
        run: make silo-up

      - name: make s3-conformance
        run: make s3-conformance

      - name: make silo-down
        if: always()
        run: make silo-down

      - name: Upload the Silo server log (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: silo-server-log
          path: .out/silo.log
          if-no-files-found: warn
          retention-days: 14

  # Which e2e legs the change runs (owner, 2026-11-20; Q-ARCH-540 to Q-ARCH-543): read once from the changed paths of the push, or of
  # the pull request against the merge base with its base, on the standard runners, and handed to the legs as outputs, so a leg that does not apply is a skipped job and takes no runner. The
  # rules and their lists are .github/scripts/e2e-legs.sh; docs/developer/releasing.md#which-e2e-legs-a-change-runs has them as a table.
  # - A format's leg (e2e-npm, e2e-nuget, e2e-oci, e2e-deb, e2e-ansible) runs when the push changed that format's own paths: its
  #   package under internal/formats, its data port under internal/formatdata, the files of shared packages named after it (API,
  #   wiring, configuration, audit events, importer, admin command, queries, migrations), its test upstream and client manifests under
  #   test/ and deploy/dev, its e2e tests (test/e2e/<format>_*) and client images, its pins of client images in tools/versions.env and
  #   its job here.
  # - Shared code runs the reference leg, npm, and no other format's leg: every path that is no format's alone and not in the list
  #   below, among them internal/ (the server's core: httpserver, formathost, mirror, proxy, virtual, uploads, items, jobs, auth,
  #   authz, app, meta, ...), cmd/, api/, deploy/helm/quader, deploy/dev (up.sh, e2e.sh, lib.sh, the profile's values and
  #   manifests), test/e2e's harness (env_test.go, m1_env_test.go, mirror_env_test.go, limits_clients_env_test.go, cmd/driver, k6/,
  #   clients/fwd), .github/actions, .github/scripts, the Makefile, the Containerfile, go.mod, the other pins and the header and the jobs
  #   image and e2e-scope of this file. A path on no list is shared code by this rule: it starts npm, never nothing.
  # - No format leg: web/ (the UI is what access-long, the UI layout checks and the web unit tests see; the paths of web/ that
  #   Ansible's documentation journey runs on and opens are on Ansible's list), the documentation (but docs/manual, which is in the
  #   binary), the Markdown files at the root, test/integration,
  #   Go test files outside test/e2e, internal/tools, internal/archtest, test/chart, test/compat, test/coverage, the root package.json,
  #   hack/, the test advisory source and the CI issuer double (test/osvstub, test/oidcstub and their manifests), the Bastion's chart,
  #   deploy/ui-dev and test/devidp, the other workflows, the nightly's select-leg, the configuration of golangci-lint, Trivy,
  #   Renovate, semantic-release and actionlint, and every other job of this file.
  # - bastion and vuln keep their own lists; their own job here starts them too.
  # - A pull request is decided like a push, from what its head changed since the merge base with its base, so that a dependency
  #   bot's pull request takes only the legs its change concerns. A dispatch and the first push of a branch (no commit before it to
  #   compare with) run every leg, and so does an error of the script. A leg runs unless the output says false, so a failed decision
  #   runs it as well.
  # What only another format's client shows of a change of shared code is found in the nightly, which runs every format's set
  # (performance.yml); until the first stable release no e2e leg gates the release anyway (Q-ARCH-457).
  e2e-scope:
    name: which e2e legs the change runs
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      npm: ${{ steps.decide.outputs.npm }}
      nuget: ${{ steps.decide.outputs.nuget }}
      oci: ${{ steps.decide.outputs.oci }}
      deb: ${{ steps.decide.outputs.deb }}
      ansible: ${{ steps.decide.outputs.ansible }}
      bastion: ${{ steps.decide.outputs.bastion }}
      vuln: ${{ steps.decide.outputs.vuln }}
      client-images: ${{ steps.images.outputs.rows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide from the changed paths
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/e2e-legs.sh

      # The rows of the job client-images (Q-ARCH-638): each set of clients images on each runner kind whose legs run. npm and NuGet
      # on the GitHub-hosted runners always, for e2e-ci, which runs on every push (and e2e-nuget, e2e-bastion and e2e-vuln there);
      # npm on the self-hosted runners for e2e-npm; OCI, APT and Ansible there for their own legs. A leg runs unless its output says
      # false, and so does its row; without a decision (a failed step) every row runs.
      - name: The clients images the legs need
        id: images
        if: ${{ !cancelled() }}
        env:
          NPM: ${{ steps.decide.outputs.npm }}
          OCI: ${{ steps.decide.outputs.oci }}
          DEB: ${{ steps.decide.outputs.deb }}
          ANSIBLE: ${{ steps.decide.outputs.ansible }}
        run: |
          set -euo pipefail
          rows='{"images":"npm","runner":"ubuntu-24.04"},{"images":"nuget","runner":"ubuntu-24.04"}'
          [ "$NPM" = false ] || rows="$rows"',{"images":"npm","runner":"self-hosted"}'
          [ "$OCI" = false ] || rows="$rows"',{"images":"oci","runner":"self-hosted"}'
          [ "$DEB" = false ] || rows="$rows"',{"images":"apt","runner":"self-hosted"}'
          [ "$ANSIBLE" = false ] || rows="$rows"',{"images":"ansible","runner":"self-hosted"}'
          echo "rows=[$rows]" >> "$GITHUB_OUTPUT"
          echo "clients images of this run: [$rows]"

  # The clients images of the legs that run (Q-ARCH-638): one row per set and runner kind, from the output client-images of
  # e2e-scope, built here at most once per run and loaded by every leg that needs them, which builds none itself. On a hit a row
  # only looks its key up (about a minute of a runner); on a miss it builds the set once, every fetch bounded and retried, and
  # saves the tar, and the legs restore it. The reason (2026-11-23): when the inputs of the NuGet image had changed, the three legs
  # of one push that need it (e2e-ci, e2e-nuget, e2e-vuln) built it side by side, each against the same slow Ubuntu archive, and
  # each ran into its step's limit of 30 minutes without a test. Two runner kinds, because the self-hosted runners compress the
  # Actions cache with gzip and the GitHub-hosted ones with zstd, and an entry of one kind is invisible to the other: `self-hosted`
  # builds for the legs on `large` (the same runner image), `ubuntu-24.04` for the GitHub-hosted legs. A failed row leaves its
  # reason as an artifact; the legs still start and fail at their load step with that sentence. Runs beside the job image,
  # which the legs need as well, so a hit adds no wall time.
  client-images:
    name: clients images (${{ matrix.images }}, ${{ matrix.runner }})
    needs: e2e-scope
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-scope.outputs.client-images || '[{"images":"npm","runner":"self-hosted"},{"images":"npm","runner":"ubuntu-24.04"},{"images":"nuget","runner":"ubuntu-24.04"},{"images":"oci","runner":"self-hosted"},{"images":"apt","runner":"self-hosted"},{"images":"ansible","runner":"self-hosted"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      # The docker driver: the build takes the base images client-images.sh pulled, each pull bounded and retried, into the
      # daemon; the docker-container driver would pull them again inside the build, unbounded.
      - name: Set up Docker Buildx (docker driver)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
          cache-binary: false

      - name: Log in to Docker Hub (the base images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      # A healthy build took 21 to 250 s in the logs of 2026-11-19 to 2026-11-23 (NuGet on GitHub-hosted runners, three at
      # once), the deletion of the hosted runner's SDKs about two minutes more; the longest retry cycle of one stalled fetch is
      # a base image's pull, 3 x 180 s and 15 s of pauses. 20 minutes hold both; a build that needs more is not a slow mirror.
      - name: Look up, or build and save, the ${{ matrix.images }} clients images
        timeout-minutes: 20
        uses: ./.github/actions/client-images
        with:
          set: ${{ matrix.images }}
          build: 'true'

  # The failure suite on a kind cluster, two legs: the push set (the M0 checks, the drain with a transfer loop and
  # the exposure of E1.14) and access-long (the E1.1 sign-in, the E1.11 replica scatter and the E1.13 500 MB transfers;
  # the only leg with browser journeys). The failover set (E0.13: PostgreSQL switchover, kill and stop, Valkey failover,
  # kill and outage under k6 load; the E1.8 limits) left this job: it runs nightly and on dispatch in performance.yml
  # (owner, 2026-11-01). The legs load the image of the job image (Q-ARCH-522), so they start after it. Each has its own
  # cluster name and edge port, so legs can share a Docker host.
  e2e:
    name: e2e (${{ matrix.set }})
    needs: image
    runs-on: large
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: push
            port: "8080"
          - set: access-long
            port: "8086"
            browser: true
    env:
      # The job image builds it with an explicit VERSION=dev (the binary refuses a version that is not major.minor.patch or "dev",
      # docs/developer/e2e.md); the leg loads it from the artifact quader-image into the local Docker.
      QUADER_IMAGE: guidedtraffic/quader:dev
      QUADER_DEV_CLUSTER: quader-${{ matrix.set }}-${{ github.run_id }}
      QUADER_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: kind
          package: sigs.k8s.io/kind
          version: ${{ env.KIND_VERSION }}
          bin: 'true'

      - name: Install the shared library the pinned Node.js loads
        if: matrix.browser
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          .github/scripts/apt-install.sh libatomic1

      - name: Set up Node.js (the Playwright journeys)
        if: matrix.browser
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the Playwright journeys and their browser
        timeout-minutes: 25
        if: matrix.browser
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          # The browser build is the one the locked @playwright/test version names: one version per tool.
          # A runner that lacks the browser's system libraries installs them through Playwright's own apt call, not through
          # .github/scripts/apt-install.sh; the step's timeout bounds it instead (npm ci and the browser took 101 s in a
          # green run). A runner that has them fetches the browser only.
          ../.github/scripts/playwright-install.sh chromium

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Tools on the runner
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          kind version
          kubectl version --client
          helm version --short
          jq --version
          nproc
          free -g

      - name: The dev profile's dependency pins and the runner architecture
        run: |
          set -euo pipefail
          # The Valkey operator and the internal-secrets-operator images are published for linux/amd64
          # only (tools/versions.env); the hosted runner is amd64, so no emulation is needed here.
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "HAProxy Ingress chart $DEV_HAPROXY_INGRESS_CHART_VERSION, image $DEV_HAPROXY_INGRESS_IMAGE"
          echo "cert-manager chart $DEV_CERT_MANAGER_CHART_VERSION (images pinned by digest)"
          echo "valkey-operator chart $DEV_VALKEY_OPERATOR_CHART_VERSION, internal-secrets-operator chart $DEV_ISO_CHART_VERSION"
          echo "CloudNativePG chart $CNPG_CHART_VERSION"
          # up.sh installs the charts of these repositories; the haproxy-ingress and cloudnative-pg archives are release assets, fetched by make dev-charts. Fail early, not 5 minutes into make dev-up.
          for u in https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --connect-timeout 20 --max-time 60 --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: Load the Quader image of this run
        timeout-minutes: 10
        uses: ./.github/actions/quader-image

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        timeout-minutes: 60
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the k6 logs and summaries, the pod watch, the events and the driver output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-${{ matrix.set }}
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${QUADER_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          kubectl config get-contexts || true
          for ns in quader ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n quader status quader > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always()
        run: make dev-down

  # The npm acceptance matrix (R-NPM-045, roadmap M2 E2.1 to E2.12) with the npm side of the remote full mirror (R-REPO-055, R-REPO-059, Q-REPO-306): eight real clients against the scatter profile and the
  # counting test upstream, docs/developer/e2e.md#the-npm-client-matrix. The leg npm is the reference leg (Q-ARCH-541): it runs when
  # the push changed npm's own paths or shared code (job e2e-scope), and on every dispatch. The legs
  # npm-ha and npm-ha-crash are E2.11 (Q-HA-67: drain variant A, the PostgreSQL-switchover and Valkey-failover scenarios
  # under the npm load, and the pod crash with three force-deletes). They left this job for performance.yml, which runs
  # npm-ha nightly and on dispatch (owner, 2026-11-01). The three-force-delete crash has no CI leg after that and is run
  # by hand (make e2e SET=npm-ha-crash). A dispatch with closing=true (Q-NPM-46) replaces the matrix with the legs of the
  # commit that closes the phase: npm-closing (the scenario list and the cold-cache install with Valkey stopped, and the
  # read-only subset against the public registry) and npm-ha-closing (npm-ha, the 20-minute pod crash and the 5-minute
  # Valkey outage under the npm load). The closing run also runs fuzz-npm, below.
  # The ports differ from the e2e job's (8080, 8086) so that the jobs can share a runner host.
  e2e-npm:
    name: e2e (${{ matrix.set }})
    needs: [image, client-images, e2e-scope]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.e2e-scope.outputs.npm != 'false' }}
    runs-on: large
    timeout-minutes: ${{ startsWith(matrix.set, 'npm-ha') && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.closing && '[{"set":"npm","port":"8082"},{"set":"npm-closing","port":"8083"},{"set":"npm-ha-closing","port":"8084"}]' || '[{"set":"npm","port":"8082"}]') }}
    env:
      QUADER_IMAGE: guidedtraffic/quader:dev
      QUADER_DEV_CLUSTER: quader-${{ matrix.set }}-${{ github.run_id }}
      QUADER_DEV_HTTP_PORT: ${{ matrix.port }}
      # The clients images come from the job client-images of this run, through .github/actions/client-images, which loads
      # them from the cache and builds nothing (Q-ARCH-638); deploy/dev/e2e.sh loads them into kind and does not build them again.
      QUADER_E2E_NPM_CLIENTS_IMAGE_BUILD: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: kind
          package: sigs.k8s.io/kind
          version: ${{ env.KIND_VERSION }}
          bin: 'true'

      # The clients run inside the clients image (its own Node.js, test/e2e/clients/Dockerfile), so this job needs no
      # Node.js on the runner and none of the libraries the pinned Node.js loads (Q-ARCH-218).

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The dev profile's dependency pins and the runner architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, clients Node image $E2E_CLIENTS_NODE_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          for u in https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --connect-timeout 20 --max-time 60 --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: Load the npm clients image
        timeout-minutes: 10
        uses: ./.github/actions/client-images
        with:
          set: npm

      - name: Load the Quader image of this run
        timeout-minutes: 10
        uses: ./.github/actions/quader-image

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        timeout-minutes: ${{ startsWith(matrix.set, 'npm-ha') && 80 || 60 }}
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the matrix report, the client logs, the test upstream's counters, the load records and k6 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${QUADER_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in quader ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n quader status quader > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always()
        run: make dev-down

  # The NuGet acceptance suite (R-NUGET-027, roadmap M3 E3.1 to E3.8) on a kind cluster: the .NET 10 SDK and nuget.exe on
  # Mono in the client pods, against the scatter profile and the counting NuGet test upstream (docs/developer/e2e.md#the-nuget-clients).
  # The leg nuget runs every TestNuGet... except the closing and HA names (Q-NUGET-34), the NuGet mirror (TestNuGetMirror...) among them, when the push changed
  # NuGet's own paths (job e2e-scope), and on every dispatch; the nightly runs it too (job format-nuget of performance.yml). A dispatch with
  # closing=true adds the leg nuget-closing (TestNuGetClosing...). The nightly leg nuget-ha is job e2e-nuget in performance.yml.
  # The ports 8088 to 8090 are the first free ones of both workflows (Q-ARCH-277); the legs differ from the others in cluster name and port.
  e2e-nuget:
    name: e2e (${{ matrix.set }})
    needs: [image, client-images, e2e-scope]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.e2e-scope.outputs.nuget != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.closing && '[{"set":"nuget","port":"8088"},{"set":"nuget-closing","port":"8089"}]' || '[{"set":"nuget","port":"8088"}]') }}
    env:
      QUADER_IMAGE: guidedtraffic/quader:dev
      QUADER_DEV_CLUSTER: quader-${{ matrix.set }}-${{ github.run_id }}
      QUADER_DEV_HTTP_PORT: ${{ matrix.port }}
      # The clients images come from the job client-images of this run, through .github/actions/client-images, which loads
      # them from the cache and builds nothing (Q-ARCH-638); deploy/dev/e2e.sh loads them into kind and does not build them again.
      QUADER_E2E_NUGET_CLIENTS_IMAGE_BUILD: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The GitHub-hosted runner's preinstalled SDKs (Android, .NET, Haskell, CodeQL) take the disk space that the kind
      # nodes, the images and the build caches need; no job here uses them.
      - name: Free disk space (GitHub-hosted runner)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: kind
          package: sigs.k8s.io/kind
          version: ${{ env.KIND_VERSION }}
          bin: 'true'

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Load the NuGet clients image
        timeout-minutes: 10
        uses: ./.github/actions/client-images
        with:
          set: nuget

      - name: The dev profile's dependency pins and the runner architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, NuGet SDK $E2E_NUGETCLIENTS_SDK_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          for u in https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --connect-timeout 20 --max-time 60 --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: Load the Quader image of this run
        timeout-minutes: 10
        uses: ./.github/actions/quader-image

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        timeout-minutes: 60
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nuget-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the matrix report, the clients image log, the test upstream's counters, the client logs and the k6 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nuget-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${QUADER_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in quader ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
