  # Ingress, with the real npm, pnpm, Yarn 4 and .NET clients of the client pods and the browser journey of the Bastions screen. The
  # short set `bastion` runs when the change touches internal/bastion, internal/bastionmain, deploy/helm/quader-bastion or
  # docs/spec/bastion.md (and the suite's own files, and this job), and on every dispatch; for any other change the
  # job is skipped and takes no runner (job e2e-scope). The long legs (the
  # drain, the flood and the anonymous flood) are the set bastion-long of job e2e-bastion in performance.yml, outside the release path
  # (owner, 2026-11-01). Edge port 8093 is the first free one of both workflows.
