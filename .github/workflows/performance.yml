  # skipped a format's leg carries the newest report of that set from either workflow (tools/fetch-e2e-reports.sh). The four legs
  # on the large class run in lane 3 (Q-ARCH-431) after oci-long, one after the other, about 68 minutes of legs (oci 16, deb 12,
  # ansible 16, npm 24 in Test and Release 44693590111), which ends lane 3 at about 121 minutes, still below lane 1's 244: they
  # add no wall time to the night. The NuGet set runs on a GitHub-hosted runner, as in Test and Release (the 2.3 GB clients image),
