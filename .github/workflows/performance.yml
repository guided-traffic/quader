      QUADER_E2E_NUGET_CLIENTS_IMAGE_BUILD: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the sets of a dispatch; on the schedule, a recent full run)
        id: leg
        uses: ./.github/actions/select-leg
        with:
