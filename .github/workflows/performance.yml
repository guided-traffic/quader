  # The upgrade legs (deploy/dev/e2e.sh; docs/developer/e2e.md#the-upgrade-tests), cut by what they test (Q-HA-314), each on a kind
  # cluster under the npm and the NuGet client loops and with a browser journey:
  # - upgrade: the commit with its second UI bundle (make image-marked) rolled to the image built from the commit. It needs no
  #   published artifact and runs nightly.
  # - upgrade-release: the newest published release before the commit (the chart from https://guided-traffic.github.io/quader/, its
  #   image guidedtraffic/quader:<x.y.z> from Docker Hub; Q-HA-311) upgraded to the image built from the commit and rolled back.
  #   Until the first stable release it runs only on a dispatch that names it or the job (-f sets=upgrade-release, Q-ARCH-340):
  #   a commit may then need a new database, which the test skips with its reason (Q-HA-312). To run it nightly, set its
  #   matrix entry's nightly to true.
  # Both clients images are needed, so the legs run on GitHub-hosted runners with the disk space freed, as e2e-vuln does
  # (Q-ARCH-326); each leg has a runner of its own, and the edge ports 8101 and 8107 are free on the large class as well.
  # A red leg is a finding and holds nothing (owner, 2026-11-01).
  e2e-upgrade:
    name: e2e (${{ matrix.set }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: upgrade
            port: "8101"
            nightly: "true"
          - set: upgrade-release
            port: "8107"
            nightly: "false"
    env:
      QUADER_IMAGE: guidedtraffic/quader:dev
      QUADER_DEV_CLUSTER: quader-${{ matrix.set }}-${{ github.run_id }}
      QUADER_DEV_HTTP_PORT: ${{ matrix.port }}
      # The clients images come from .github/actions/client-images (the cache, or a build when their inputs changed);
      # deploy/dev/e2e.sh loads them into kind and does not build them again.
      QUADER_E2E_NPM_CLIENTS_IMAGE_BUILD: "0"
      QUADER_E2E_NUGET_CLIENTS_IMAGE_BUILD: "0"
    steps:
      # The upgrade from the published release finds the release to start from among the tags: the checkout needs every tag.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select the leg (the sets of a dispatch; on the schedule, a recent full run)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: ${{ matrix.set }}
          job: e2e-upgrade
          sets: ${{ inputs.sets }}
          nightly: ${{ matrix.nightly }}
          token: ${{ github.token }}

      # The GitHub-hosted runner's preinstalled SDKs (Android, .NET, Haskell, CodeQL) take the disk space that the kind
      # nodes, the images and the build caches need; no job here uses them.
      - name: Free disk space (GitHub-hosted runner)
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Load the tool pins
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the Go modules of go.sum
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 10
        uses: ./.github/actions/go-modules

      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Set up Node.js (the browser journey of the upgrade)
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the Playwright journey and its browser
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          ../.github/scripts/playwright-install.sh chromium

      - name: Install the pinned helm
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 10
        uses: ./.github/actions/go-tool
        with:
          name: kind
          package: sigs.k8s.io/kind
          version: ${{ env.KIND_VERSION }}
          bin: 'true'

      - name: Install the pinned Docker Buildx
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        if: steps.leg.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images and the published releases)
        if: steps.leg.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Load or build the npm clients image
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 30
        uses: ./.github/actions/client-images
        with:
          set: npm

      - name: Load or build the NuGet clients image
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 30
        uses: ./.github/actions/client-images
        with:
          set: nuget

      - name: The dev profile's dependency pins and the runner architecture
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, clients Node image $E2E_CLIENTS_NODE_IMAGE, NuGet SDK $E2E_NUGETCLIENTS_SDK_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          # The published releases come from the chart repository of GitHub Pages; the rest is the dev profile's own.
          for u in https://guided-traffic.github.io/quader https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --connect-timeout 20 --max-time 60 --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: Load the Quader image of this run
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 10
        uses: ./.github/actions/quader-image

      # TestUpgrade_R_HA_020_AcrossTwoBundles installs the commit with its second UI bundle and upgrades to the image above (Q-HA-124).
      - name: make image-marked
        if: matrix.set == 'upgrade' && steps.leg.outputs.run == 'true'
        run: make image-marked VERSION=dev

      - name: Fetch the dev charts that are GitHub release assets
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 16
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 90
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the job logs (ci-job-*.log), the clients image logs, the upgrade's records and the test output
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-playwright-${{ matrix.set }}
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        run: |
          set -u
          ctx="kind-${QUADER_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          kubectl config get-contexts || true
          for ns in quader ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n quader status quader > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always() && steps.leg.outputs.run == 'true'
        run: make dev-down
