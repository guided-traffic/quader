        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 30
        uses: ./.github/actions/client-images
        with:
          set: npm

      - name: Load the Quader image of this run
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 10
        uses: ./.github/actions/quader-image

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        if: steps.leg.outputs.run == 'true'
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 80
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-report-${{ matrix.set }}
