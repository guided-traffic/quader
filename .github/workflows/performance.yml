          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always() && steps.leg.outputs.run == 'true'
        run: make dev-down

  # Drain variant D of R-HA-059 (an instance of the transaction-mode pooler on the drained node, R-HA-058) under the whole load, the long-transfer probes
