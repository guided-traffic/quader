# The client images of one set of the acceptance suites, keyed by their inputs (Q-ARCH-520, Q-ARCH-521): the key of
# .github/scripts/client-images.sh (a hash of the build context, the pins the build reads, the scripts its fetches run through, the
# forwarder binary and the script), the tar of `docker save` in the GitHub Actions cache under that key. Two modes (Q-ARCH-638):
#
#   build: 'true'   the job `clients images` of a run, one row per set and runner kind: it only looks the key up; on a miss it builds
#                   the set once (every fetch bounded and retried, F-158 and 2026-11-23) and saves the tar at once. A failed build
#                   leaves its reason as the artifact client-images-<set>-<runner kind>-failure.
#   build: 'false'  a leg: it restores the tar and loads it, and builds nothing. Without a tar it fails with one sentence that names
#                   the images and, from the builder's artifact, the fetch that failed and after how many attempts.
#
# So a run builds each set at most once per runner kind (with the pinned zstd on PATH on both kinds, Q-ARCH-1061, the entry is one
# and the second kind's row finds it; a kind whose zstd step failed writes and reads a gzip entry of its own), and the legs that
# need it wait for that one build instead of each building it beside the others. A leg that uses this sets
# QUADER_E2E_<SET>_CLIENTS_IMAGE_BUILD=0, so deploy/dev/e2e.sh loads the images into kind and does not build them again. The tar
# is deleted afterwards: the images are in Docker, and a large leg has no disk to spare.
# Run after actions/checkout and the Go setup (the key builds the forwarder); in build mode after Buildx is set up with the
# docker driver and Docker Hub is logged in.
name: Client images of the acceptance suites
description: Load the client images of one e2e set from the GitHub Actions cache, or in the run's builder job build and cache them when their inputs changed
inputs:
  set:
    description: npm, nuget, oci, apt or ansible (the sets of .github/scripts/client-images.sh)
    required: true
  build:
    description: "'true' in the job that builds the run's clients images; 'false' (the default) in a leg, which only loads them"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Key the images by their inputs
      id: key
      shell: bash
      env:
        SET: ${{ inputs.set }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/../../scripts/client-images.sh" key "$SET" >/dev/null
        echo "tar=.out/client-images/${SET}.tar" >> "$GITHUB_OUTPUT"
        case "$RUNNER_ENVIRONMENT" in github-hosted) kind=github-hosted ;; *) kind=self-hosted ;; esac
        echo "failure=client-images-${SET}-${kind}-failure" >> "$GITHUB_OUTPUT"

    - name: Look the images up, or restore them
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.tar }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: ${{ inputs.build }}

    # The builder on a miss. A GitHub-hosted runner's preinstalled SDKs take the disk the NuGet image's build needs (the three
    # SDK images, the image and its tar, about 8 GB); the self-hosted runners have no such SDKs.
    - name: Build the images (a miss)
      id: images
      if: inputs.build == 'true' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        SET: ${{ inputs.set }}
        TAR: ${{ steps.key.outputs.tar }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
        fi
        "$GITHUB_ACTION_PATH/../../scripts/client-images.sh" build "$SET" "$TAR"

    - name: Save the built images under their key
      if: inputs.build == 'true' && steps.images.outputs.built == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.tar }}
        key: ${{ steps.key.outputs.key }}

    - name: Leave the reason of a failed build for the legs
      if: failure() && inputs.build == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.key.outputs.failure }}
        path: ${{ steps.key.outputs.tar }}.failure
        if-no-files-found: ignore
        retention-days: 7

    # A pattern, not a name: a builder that left no reason (it was skipped, or the entry was evicted) matches nothing, which is
    # no error, and the load step then says so.
    - name: Fetch the builder's reason (the images are not in the cache)
      if: inputs.build != 'true' && steps.restore.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ steps.key.outputs.failure }}
        merge-multiple: true
        path: .out/client-images/builder

    - name: Load the images
      if: inputs.build != 'true'
      shell: bash
      env:
        SET: ${{ inputs.set }}
        TAR: ${{ steps.key.outputs.tar }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/client-images.sh" load "$SET" "$TAR" ".out/client-images/builder/${SET}.tar.failure"'

    - name: Remove the tar
      if: always()
      shell: bash
      env:
        TAR: ${{ steps.key.outputs.tar }}
      run: rm -f "$TAR"
