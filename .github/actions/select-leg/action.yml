# Decides whether one leg of a job of "HA and Performance (nightly)" runs in this run (the input `sets` of a dispatch,
# docs/developer/releasing.md#ha-and-performance-nightly, Q-ARCH-324). A leg runs when `sets` is empty (the schedule's
# behaviour) or names its set or its job key among the comma-separated values. A leg with nightly "false" runs only when
# `sets` names it or its job key, never on the schedule (Q-HA-314: the upgrade from the published release until the first
# stable release). On the schedule a leg is also skipped when a dispatch that ran every leg ended shortly before
# (docs/developer/releasing.md#a-scheduled-run-after-a-full-run); that check reads the Actions API with the input token and
# runs the leg when the API does not answer. A leg that does not run says so in the job summary, so a green job with skipped
# steps is not read as a passed test. The decision is select-leg.sh beside this file, tested by
# internal/tools/ciworkflows/selectleg_test.go. Run after actions/checkout.
name: Select the leg
description: Output run=true when the leg runs in this run; an empty sets runs every leg the nightly run runs
inputs:
  leg:
    description: The set of the matrix leg, for example ha-suite
    required: true
  job:
    description: The job key; a dispatch that names it runs every leg of that job
    required: true
  sets:
    description: The comma-separated sets of the dispatch input; empty runs every leg the nightly run runs
    required: false
    default: ""
  nightly:
    description: '"false" for a leg that runs only on a dispatch that names it or its job key'
    required: false
    default: "true"
  token:
    description: A token with actions read, for the check of a scheduled run; the workflow passes github.token
    required: true
outputs:
  run:
    description: "true when the leg runs, false when it does not"
    value: ${{ steps.decide.outputs.run }}
runs:
  using: composite
  steps:
    - name: Decide whether the leg runs
      id: decide
      shell: bash
      env:
        LEG: ${{ inputs.leg }}
        JOB: ${{ inputs.job }}
        SETS: ${{ inputs.sets }}
        NIGHTLY: ${{ inputs.nightly }}
        TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/select-leg.sh"
